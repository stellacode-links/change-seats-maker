<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>席替えメーカー</title>

<style>
:root{
  --yellow:#f5e342;
  --dark:#333;
  --line:#ddd;
  --blue:#4a90e2;
  --red:#e85b67;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;
  color:var(--dark);
  background:#fafafa;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  background:var(--yellow);
  padding:23px 16px;
  text-align:center;
  box-shadow:0 2px 8px #0002;
}

.header h1{
  margin:0;
  font-size:30px;
  font-weight:800;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 3px 15px #0000000a;
}

.title{
  font-size:21px;
  font-weight:800;
  margin:0 0 16px;
}

.sub{
  font-size:16px;
  font-weight:800;
  margin:25px 0 10px;
}

.front{
  width:min(650px,90%);
  margin:0 auto 16px;
  background:#eee;
  border-radius:7px;
  text-align:center;
  padding:7px;
  color:#666;
  font-size:13px;
}

.seat-wrap{
  overflow:auto;
  padding:5px;
}

.seat-grid{
  display:grid;
  justify-content:center;
  width:max-content;
  margin:auto;
}

.seat{
  width:92px;
  min-height:64px;
  border:2px solid #d6d6d6;
  background:#fff;
  border-radius:10px;
  color:#333;
  font-weight:700;
  padding:6px;
  overflow-wrap:anywhere;
  transition:.15s;
}

.seat:hover{
  border-color:#c9b800;
  transform:translateY(-1px);
}

.seat.empty{
  color:#999;
  font-weight:500;
}

.seat.male{
  color:var(--blue);
}

.seat.female{
  color:var(--red);
}

.gap-r{
  margin-right:15px;
}

.gap-b{
  margin-bottom:15px;
}

.setting-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.field label{
  font-size:13px;
  font-weight:700;
  display:block;
}

select,
input[type=number],
input[type=text],
textarea{
  width:100%;
  margin-top:6px;
  padding:10px;
  border:1px solid #ccc;
  border-radius:9px;
  background:white;
  outline:none;
}

textarea{
  resize:vertical;
  min-height:130px;
  line-height:1.7;
}

.bulk-example{
  color:#aaa;
  font-size:13px;
  line-height:1.7;
  margin-top:7px;
}

.bulk-btn,
.add,
.remove{
  border:0;
  background:#eee;
  border-radius:9px;
  padding:10px 14px;
  font-weight:700;
}

.bulk-btn{
  margin-top:10px;
}

.bulk-btn:hover,
.add:hover,
.remove:hover{
  background:#ddd;
}

.rule-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

/* 近づける・離すの条件追加部分だけ間隔を確保 */
#nearRules,
#farRules{
  margin-bottom:14px;
}

#nearRules + .add,
#farRules + .add{
  margin-top:4px;
}

#nearRules .remove,
#farRules .remove{
  margin-left:8px;
}

.rule{
  display:grid;
  gap:7px;
  align-items:end;
}

.rule.column{
  grid-template-columns:minmax(130px,1fr) 120px 120px 44px;
}

.rule.position{
  grid-template-columns:minmax(130px,1fr) 145px 145px 44px;
}

.rule.distance{
  grid-template-columns:minmax(130px,1fr) minmax(130px,1fr) 90px 100px 44px;
}

.rule.leader{
  grid-template-columns:minmax(130px,1fr) 44px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:18px;
}

.main-btn,
.sub-btn{
  border:0;
  border-radius:11px;
  padding:13px 22px;
  font-weight:800;
}

.main-btn{
  background:var(--yellow);
}

.main-btn:hover{
  background:#d9c900;
}

.sub-btn{
  background:#eee;
}

.sub-btn:hover{
  background:#ddd;
}

.check{
  display:flex;
  gap:9px;
  align-items:center;
  margin-top:12px;
  font-weight:600;
  font-size:14px;
}

.check input{
  width:19px;
  height:19px;
  margin:0;
  accent-color:#d3c300;
}

.status{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-top:10px;
  min-height:20px;
}

.gender-columns{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:10px;
}

.gender-column{
  border:1px solid #ddd;
  border-radius:12px;
  padding:10px;
  min-width:105px;
  background:#fafafa;
}

.gender-column-title{
  text-align:center;
  font-size:13px;
  font-weight:800;
  margin-bottom:8px;
}

.gender-switch{
  display:flex;
  border-radius:999px;
  background:#eee;
  padding:3px;
  gap:2px;
}

.gender-switch button{
  flex:1;
  border:0;
  background:transparent;
  border-radius:999px;
  padding:7px 5px;
  font-size:12px;
  font-weight:800;
}

.gender-switch button.active.male{
  background:var(--blue);
  color:white;
}

.gender-switch button.active.female{
  background:var(--red);
  color:white;
}

.gender-switch button.active.none{
  background:#777;
  color:white;
}


/* モーダル */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:20000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(430px,100%);
  background:white;
  border-radius:18px;
  padding:22px;
  box-shadow:0 15px 50px #0004;
}

.modal-box h3{
  margin:0 0 18px;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.modal-actions button{
  flex:1;
  border:0;
  border-radius:10px;
  padding:12px;
  font-weight:800;
}
 .presentation{
  display:none;
  position:fixed;
  inset:0;
  background:#fff;
  z-index:10000;
  overflow:auto;
}

.presentation.show{
  display:block;
}

.presentation-head{
  height:72px;
  background:var(--yellow);
  display:flex;
  align-items:center;
  justify-content:center;
  position:sticky;
  top:0;
  z-index:2;
}

.presentation-head h2{
  margin:0;
  font-size:24px;
}

.presentation-close{
  position:absolute;
  right:18px;
  top:15px;
  border:0;
  background:#fff;
  border-radius:10px;
  padding:10px 16px;
  font-weight:800;
}

.presentation-stage{
  min-height:calc(100vh - 72px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:35px;
}

.presentation-board{
  width:min(1200px,96vw);
}

.presentation-front{
  background:#eee;
  border-radius:8px;
  padding:9px;
  text-align:center;
  color:#666;
  font-size:14px;
  margin-bottom:22px;
}

.presentation-table{
  display:grid;
  justify-content:center;
  gap:8px;
}

.presentation-seat{
  width:100px;
  min-height:68px;
  border:2px solid #d6d6d6;
  background:white;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:7px;
  font-weight:800;
  overflow-wrap:anywhere;
  transition:.2s;
}

.presentation-seat.hidden-seat{
  background:#111;
  border-color:#111;
  color:#111;
}

.presentation-seat.revealed{
  animation:seatPop .28s ease;
}

.presentation-seat.male{
  color:var(--blue);
}

.presentation-seat.female{
  color:var(--red);
}

@keyframes seatPop{
  from{
    transform:scale(.75);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

.slot-seat{
  animation:slotFlash .12s linear infinite;
}

@keyframes slotFlash{
  0%{
    transform:scale(.97);
  }
  50%{
    transform:scale(1.03);
  }
  100%{
    transform:scale(.97);
  }
}


/* 印刷 */

#printArea{
  display:none;
}

.print-page-title{
  text-align:center;
  font-size:28px;
  font-weight:800;
  margin-bottom:20px;
}

.print-board{
  border:2px solid #333;
  padding:20px;
  display:inline-block;
  min-width:80%;
  margin-left:10%;
  margin-right:10%;
}

.print-blackboard{
  text-align:center;
  border:2px solid #333;
  padding:8px;
  margin-bottom:20px;
  font-weight:800;
}

.print-blackboard.bottom{
  margin-top:20px;
  margin-bottom:0;
}

.print-grid{
  display:grid;
  justify-content:center;
  gap:8px;
}

.print-seat{
  border:2px solid #333;
  border-radius:7px;
  min-width:80px;
  min-height:55px;
  padding:8px;
  text-align:center;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
}

.print-seat.male{
  color:var(--blue);
}

.print-seat.female{
  color:var(--red);
}


@media(max-width:750px){

  .container{
    padding:12px 9px;
  }

  .card{
    padding:15px;
  }

  .setting-grid{
    grid-template-columns:1fr;
  }

  .rule.column,
  .rule.position,
  .rule.distance,
  .rule.leader{
    grid-template-columns:1fr 1fr;
  }

  .remove{
    width:100%;
  }

  .seat{
    width:72px;
    min-height:56px;
    font-size:12px;
  }

  .presentation-stage{
    padding:15px;
  }

  .presentation-seat{
    width:70px;
    min-height:55px;
    font-size:12px;
  }
}


@media print{

  body{
    background:white;
  }

  body>*:not(#printArea){
    display:none!important;
  }

  #printArea{
    display:block!important;
    padding:25px;
  }
}
</style>
</head>


<body>

<header class="header">
  <h1>席替えメーカー</h1>
</header>


<main class="container">

<section class="card">

<h2 class="title">座席表</h2>

<div class="front">黒板（前）</div>

<div class="seat-wrap">
  <div id="seatGrid" class="seat-grid"></div>
</div>

<h3 class="sub">一括入力</h3>

<textarea
  id="bulkInput"
  placeholder="田中　佐藤　空席　山田&#10;高橋　橋本　鈴木　空席"
></textarea>

<div class="bulk-example">
  例：田中　佐藤　空席　山田<br>
  　　高橋　橋本　鈴木　空席
</div>

<button id="bulkBtn" class="bulk-btn">
  一括入力する
</button>

<br>

<button id="clearSeatsBtn" class="bulk-btn">
  座席表をクリア
</button>

<h3 class="sub">列ごとの男女</h3>

<div id="genderColumns" class="gender-columns"></div>

</section>



<section class="card">

<h2 class="title">設定</h2>

<h3 class="sub">座席数の指定</h3>

<div class="setting-grid">

<div class="field">
<label>
全体：横
<select id="cols"></select>
</label>
</div>

<div class="field">
<label>
縦
<select id="rows"></select>
</label>
</div>

</div>


<h3 class="sub">班</h3>

<div class="setting-grid">

<div class="field">
<label>
横
<select id="groupCols">
<option value="0">なし</option>
<option value="2">2</option>
<option value="3">3</option>
</select>
</label>
</div>

<div class="field">
<label>
縦
<select id="groupRows">
<option value="0">なし</option>
<option value="2">2</option>
<option value="3">3</option>
</select>
</label>
</div>

</div>


<h3 class="sub">列の指定</h3>

<div id="columnRules" class="rule-list"></div>

<button id="addColumn" class="add">
＋ 条件を追加
</button>


<h3 class="sub">位置の指定</h3>

<div id="positionRules" class="rule-list"></div>

<button id="addPosition" class="add">
＋ 条件を追加
</button>


<h3 class="sub">生徒同士を近づける</h3>

<div id="nearRules" class="rule-list"></div>

<button id="addNear" class="add">
＋ 条件を追加
</button>


<h3 class="sub">生徒同士を離す</h3>

<div id="farRules" class="rule-list"></div>

<button id="addFar" class="add">
＋ 条件を追加
</button>


<h3 class="sub">班長を指定する</h3>

<div id="leaderRules" class="rule-list"></div>

<button id="addLeader" class="add">
＋ 条件を追加
</button>

</section>



<section class="card">

<h2 class="title">演出</h2>

<div class="setting-grid">

<div class="field">
<label>
演出
<select id="animation">
<option value="normal">通常</option>
<option value="slot">スロット</option>
</select>
</label>
</div>

<div class="field">
<label>
<select id="animationAxis">
<option value="row">横</option>
<option value="col">縦</option>
</select>
</label>
</div>

</div>


<label class="check">
<input type="checkbox" id="moveAll">
今の座席から全員移動させる
</label>

<label class="check">
<input type="checkbox" id="fixGender">
男女の座席を固定する
</label>


<div class="actions">

<button id="shuffleBtn" class="main-btn">
席替えする！
</button>

<button id="resetBtn" class="sub-btn">
座席をリセット
</button>

</div>

<div id="status" class="status"></div>

</section>



<section class="card">

<h2 class="title">保存・印刷</h2>

<p style="font-size:13px">
席替え後の座席表を画像として保存したり、印刷できます。
</p>

<div class="actions">

<button id="saveBtn" class="main-btn">
画像として保存
</button>

<button id="printTopBtn" class="sub-btn">
印刷（黒板が上）
</button>

<button id="printBottomBtn" class="sub-btn">
印刷（黒板が下）
</button>

</div>

</section>

</main>



<div id="inputModal" class="modal">

<div class="modal-box">

<h3>座席を編集</h3>

<div class="field">
<label>
名前
<input type="text" id="modalName">
</label>
</div>

<div class="field" style="margin-top:12px">

<label>
男女
<select id="modalGender">
<option value="">指定なし</option>
<option value="男">男</option>
<option value="女">女</option>
</select>
</label>

</div>

<div class="modal-actions">

<button id="modalCancel" class="sub-btn">
キャンセル
</button>

<button id="modalSave" class="main-btn">
保存
</button>

</div>

</div>
</div>



<div id="presentation" class="presentation">

<div class="presentation-head">

<h2>席替え</h2>

<button id="closePresentation" class="presentation-close">
閉じる
</button>

</div>

<div id="presentationStage" class="presentation-stage"></div>

</div>


<div id="printArea"></div>

<canvas id="exportCanvas" style="display:none"></canvas>



<script>
(function(){

"use strict";


var rows=6;
var cols=6;

var students=[];

var columnGenders=[];

var currentEditingIndex=-1;


for(var i=0;i<36;i++){

  students.push({
    name:"",
    gender:""
  });

}


for(var c=0;c<6;c++){
  columnGenders.push("");
}



function $(id){
  return document.getElementById(id);
}


function fillSelect(id,max,selected){

  var s=$(id);

  s.innerHTML="";

  for(var i=1;i<=max;i++){

    var o=document.createElement("option");

    o.value=i;
    o.textContent=i;

    if(i===selected){
      o.selected=true;
    }

    s.appendChild(o);

  }

}



function saveState(){

  try{

    var state={

      rows:rows,

      cols:cols,

      students:students,

      columnGenders:columnGenders,

      groupCols:$("groupCols").value,

      groupRows:$("groupRows").value,

      animation:$("animation").value,

      animationAxis:$("animationAxis").value,

      moveAll:$("moveAll").checked,

      fixGender:$("fixGender").checked

    };


    localStorage.setItem(
      "changeSeatsMakerState",
      JSON.stringify(state)
    );

  }catch(e){}

}



function loadState(){

  try{

    var raw=
      localStorage.getItem(
        "changeSeatsMakerState"
      );


    if(!raw){
      return;
    }


    var data=JSON.parse(raw);


    if(
      typeof data.rows==="number" &&
      typeof data.cols==="number"
    ){

      rows=data.rows;
      cols=data.cols;

    }


    if(Array.isArray(data.students)){
      students=data.students;
    }


    if(Array.isArray(data.columnGenders)){

      columnGenders=
        data.columnGenders.slice(0,cols);

    }


    while(columnGenders.length<cols){
      columnGenders.push("");
    }


    while(students.length<rows*cols){

      students.push({
        name:"",
        gender:""
      });

    }


    students=
      students.slice(0,rows*cols);

  }catch(e){}

}



function names(){

  var result=[];


  students.forEach(function(s){

    if(
      s.name &&
      result.indexOf(s.name)<0
    ){

      result.push(s.name);

    }

  });


  return result;

}



function studentSelect(){

  var s=document.createElement("select");

  s.className="student-select";


  var first=document.createElement("option");

  first.value="";

  first.textContent="生徒を選択";

  s.appendChild(first);


  names().forEach(function(name){

    var o=document.createElement("option");

    o.value=name;

    o.textContent=name;

    s.appendChild(o);

  });


  return s;

}



function refreshSelects(){

  document
    .querySelectorAll(".student-select")
    .forEach(function(old){

      var value=old.value;

      var replacement=studentSelect();

      replacement.value=value;

      old.parentNode.replaceChild(
        replacement,
        old
      );

    });

}



function render(){

  var grid=$("seatGrid");

  grid.innerHTML="";

  grid.style.gridTemplateColumns=
    "repeat("+cols+",92px)";


  var groupCols=
    +$("groupCols").value;

  var groupRows=
    +$("groupRows").value;


  for(var r=0;r<rows;r++){

    for(var c=0;c<cols;c++){

      var index=r*cols+c;


      var seat=
        document.createElement("button");

      seat.type="button";

      seat.className="seat";


      var person=students[index];


      seat.textContent=
        person.name || "空席";


      if(!person.name){
        seat.classList.add("empty");
      }


      if(person.gender==="男"){
        seat.classList.add("male");
      }


      if(person.gender==="女"){
        seat.classList.add("female");
      }


      if(
        groupCols &&
        (c+1)%groupCols===0 &&
        c<cols-1
      ){

        seat.classList.add("gap-r");

      }


      if(
        groupRows &&
        (r+1)%groupRows===0 &&
        r<rows-1
      ){

        seat.classList.add("gap-b");

      }


      (function(i){

        seat.onclick=function(){

          openSeatModal(i);

        };

      })(index);


      grid.appendChild(seat);

    }

  }


  renderGenderColumns();

}



function openSeatModal(index){

  currentEditingIndex=index;

  $("modalName").value=
    students[index].name || "";

  $("modalGender").value=
    students[index].gender || "";

  $("inputModal").classList.add("show");


  setTimeout(function(){

    $("modalName").focus();

  },50);

}



$("modalCancel").onclick=function(){

  $("inputModal")
    .classList.remove("show");

};



$("modalSave").onclick=function(){

  if(currentEditingIndex<0){
    return;
  }


  students[currentEditingIndex]={

    name:$("modalName").value.trim(),

    gender:$("modalGender").value

  };


  $("inputModal")
    .classList.remove("show");


  render();

  refreshSelects();

  saveState();

};



$("inputModal").addEventListener(
  "click",
  function(e){

    if(e.target===this){

      this.classList.remove("show");

    }

  }
);



function renderGenderColumns(){

  var area=$("genderColumns");

  area.innerHTML="";


  while(columnGenders.length<cols){
    columnGenders.push("");
  }


  for(var c=0;c<cols;c++){

    var box=document.createElement("div");

    box.className="gender-column";


    var title=document.createElement("div");

    title.className="gender-column-title";

    title.textContent=
      (c+1)+"列目";


    box.appendChild(title);


    var sw=document.createElement("div");

    sw.className="gender-switch";


    var none=document.createElement("button");

    none.type="button";

    none.textContent="指定なし";

    none.className="none";


    var male=document.createElement("button");

    male.type="button";

    male.textContent="男";

    male.className="male";


    var female=document.createElement("button");

    female.type="button";

    $("bulkInput").value.trim();


  if(!text){

      "一括入力する名前を入力してください。";

    return;

  }

    text
      .split(/\r?\n/)
      .map(function(line){
        return line.trim();
      })
      .filter(function(line){
        return line!=="";
      });


  var tokens=[];


  lines.forEach(function(line){

    var parts=
      line.split(/[\s　]+/);


    parts.forEach(function(p){

      if(p.trim()){
        tokens.push(p.trim());
      }

    });

  });


  for(var i=0;i<rows*cols;i++){

    var value=
      tokens[i] || "";


    if(value==="空席"){

      students[i]={
        name:"",

    }else{

      students[i].name=value;

      /*
       * 一括入力時は既に設定されている
       * 男女情報を勝手に消さない
       */
      if(
        typeof students[i].gender!=="string"
      ){

        students[i].gender="";

      }

    }

  }


  render();

  refreshSelects();

  saveState();


  $("status").textContent=
    "一括入力しました。";

      Math.max(cols,1));

   * 新しいサイズへ引き継ぐ
   */
  for(var r=0;r<rows;r++){

    for(var c=0;c<cols;c++){

      var index=
        r*cols+c;


      if(old[index]){

        newStudents.push(
          old[index]
        );

      }else{

          name:"",

        });

      }

    }

  }

  }

}

function shuffleArray(arr){

  var a=arr.slice();


  for(var i=a.length-1;i>0;i--){

    var j=
      Math.floor(
        Math.random()*(i+1)
      );


    var temp=a[i];

    a[i]=a[j];

    a[j]=temp;

  }


  return a;

}



function distanceBetween(a,b){

  var ar=
    Math.floor(a/cols);

  var ac=
    a%cols;


  var br=
    Math.floor(b/cols);

  var bc=
    b%cols;


  return Math.abs(ar-br)+
         Math.abs(ac-bc);

}



function findStudentIndex(arr,name){

  for(var i=0;i<arr.length;i++){

    if(
      arr[i] &&
      arr[i].name===name
    ){

      return i;

    }

  }


  return -1;

}



function positionOf(arr,name){

  return findStudentIndex(arr,name);

}



function validArrangement(arr){

  var rules=getRuleData();


  /*
   * 位置指定
   */
  for(var i=0;i<rules.position.length;i++){

    var rule=
      rules.position[i];

    if(!rule.name){
      continue;
    }


    var index=
      positionOf(
        arr,
        rule.name
      );


    if(index<0){
      return false;
    }


    var target=
      (rule.row-1)*cols+
      (rule.col-1);


    if(index!==target){
      return false;
    }

  }


  /*
   * 列指定
   */
  for(var j=0;j<rules.column.length;j++){

    var cr=
      rules.column[j];

    if(!cr.name){
      continue;
    }


    var index=
      positionOf(
        arr,
        cr.name
      );


    if(index<0){
      return false;
    }


    var row=
      Math.floor(index/cols);


    if(cr.direction==="front"){

      if(row+1>cr.number){
        return false;
      }

    }else{

      if(rows-row>cr.number){
        return false;
      }

    }

  }


  /*
   * 近づける
   */
  for(var n=0;n<rules.near.length;n++){

    var nr=
      rules.near[n];


    if(!nr.a || !nr.b){
      continue;
    }


    var a=
      positionOf(arr,nr.a);

    var b=
      positionOf(arr,nr.b);


    if(a<0 || b<0){
      return false;
    }


    if(
      distanceBetween(a,b)>
      nr.distance
    ){

      return false;

    }

  }


  /*
   * 離す
   */
  for(var f=0;f<rules.far.length;f++){

    var fr=
      rules.far[f];


    if(!fr.a || !fr.b){
      continue;
    }


    var fa=
      positionOf(arr,fr.a);

    var fb=
      positionOf(arr,fr.b);


    if(fa<0 || fb<0){
      return false;
    }


    if(
      distanceBetween(fa,fb)<
      fr.distance
    ){

      return false;

    }

  }


  /*
   * 男女固定
   */
  if($("fixGender").checked){

    for(var g=0;g<arr.length;g++){

      if(
        students[g].gender &&
        arr[g].gender!==
        students[g].gender
      ){

        return false;

      }

    }

  }


  /*
   * 列ごとの男女
   */
  for(var cg=0;cg<cols;cg++){

    if(!columnGenders[cg]){
      continue;
    }


    for(var rr=0;rr<rows;rr++){

      var idx=
        rr*cols+cg;


      if(
        arr[idx].name &&
        arr[idx].gender!==
        columnGenders[cg]
      ){

        return false;

      }

    }

  }


  return true;

}



function createCandidate(){

  var original=
    students.map(function(s){

      return {
        name:s.name,
        gender:s.gender
      };

    });


  var candidates=
    [];


  /*
   * 今の座席から全員移動させない場合、
   * 何人かの入れ替えを含む通常シャッフル。
   */
  if($("moveAll").checked){

    candidates=
      shuffleArray(original);

  }else{

    candidates=
      shuffleArray(original);

  }


  return candidates;

}



function generateArrangement(){

  var best=null;


  /*
   * 完全ランダムを何度か試して
   * 条件を満たす配置を探す
   */
  for(var attempt=0;attempt<12000;attempt++){

    var candidate=
      createCandidate();


    if(validArrangement(candidate)){

      best=candidate;

      break;

    }

  }


  /*
   * 条件が多い場合でも最低限動作するよう、
   * 位置指定を優先した配置を作る。
   */
  if(!best){

    best=
      createFallbackArrangement();

  }


  return best;

}



function createFallbackArrangement(){

  var result=
    new Array(rows*cols);

  var remaining=
    students.map(function(s){

      return {
        name:s.name,
        gender:s.gender
      };

    });


  /*
   * まず位置指定を配置
   */
  var rules=getRuleData();


  rules.position.forEach(function(rule){

    if(!rule.name){
      return;
    }


    var source=-1;


    for(var i=0;i<remaining.length;i++){

      if(
        remaining[i] &&
        remaining[i].name===
        rule.name
      ){

        source=i;

        break;

      }

    }


    if(source<0){
      return;
    }


    var target=
      (rule.row-1)*cols+
      (rule.col-1);


    if(!result[target]){

      result[target]=
        remaining[source];

      remaining[source]=null;

    }

  });


  var rest=
    remaining.filter(function(s){
      return s!==null;
    });


  rest=
    shuffleArray(rest);


  for(var r=0;r<result.length;r++){

    if(!result[r]){

      result[r]=
        rest.shift() || {
          name:"",
          gender:""
        };

    }

  }


  return result;

                      }

function getPresentationOrder(){

  var order=[];

  var axis=
    $("animationAxis").value;


  if(axis==="row"){

    /*
     * 横：
     * 左上 → 右へ → 次の行
     */
    for(var r=0;r<rows;r++){

      for(var c=0;c<cols;c++){

        order.push(
          r*cols+c
        );

      }

    }

  }else{

    /*
     * 縦：
     * 左上 → 下へ → 次の列
     */
    for(var c2=0;c2<cols;c2++){

      for(var r2=0;r2<rows;r2++){

        order.push(
          r2*cols+c2
        );

      }

    }

  }


  return order;

}



function startPresentation(arr){

  var seats=
    Array.from(
      document.querySelectorAll(
        ".presentation-seat"
      )
    );


  var order=
    getPresentationOrder();


  var mode=
    $("animation").value;


  /*
   * 一席ずつ順番に表示。
   * 通常は0.6秒間隔。
   */
  var current=0;


  function reveal(index){

    if(index>=order.length){

      setTimeout(function(){

        $("closePresentation").style.display=
          "block";

      },300);

      return;

    }


    var seatIndex=
      order[index];

    var seat=
      seats[seatIndex];


    if(!seat){
      return;
    }


    seat.classList.remove(
      "hidden-seat"
    );


    seat.classList.add(
      "revealed"
    );


    seat.textContent=
      arr[seatIndex].name ||
      "空席";


    if(mode==="slot"){

      playSlotEffect(
        seat,
        arr[seatIndex].name ||
        "空席",
        function(){

          current++;

          setTimeout(function(){

            reveal(current);

          },600);

        }
      );

    }else{

      current++;

      setTimeout(function(){

        reveal(current);

      },600);

    }

  }


  /*
   * 最初は全部黒。
   */
  seats.forEach(function(seat){

    seat.classList.add(
      "hidden-seat"
    );

  });


  $("closePresentation").style.display=
    "block";


  setTimeout(function(){

    reveal(0);

  },300);

}



function playSlotEffect(
  seat,
  finalName,
  callback
){

  /*
   * スロットも座席全体を表示したまま、
   * 対象の一席だけ名前が
   * ババババッと切り替わって止まる。
   */
  var allNames=
    names();


  var candidates=
    allNames.filter(function(name){

      return name!==finalName;

    });


  if(candidates.length===0){

    candidates=[
      "田中",
      "佐藤",
      "鈴木",
      "高橋",
      "山田"
    ];

  }


  seat.classList.add(
    "slot-seat"
  );


  var count=0;

  var max=12;


  var timer=
    setInterval(function(){

      var random=
        candidates[
          Math.floor(
            Math.random()*
            candidates.length
          )
        ];


      seat.textContent=
        random;


      count++;


      if(count>=max){

        clearInterval(timer);


        seat.classList.remove(
          "slot-seat"
        );


        seat.textContent=
          finalName;


        setTimeout(
          callback,
          150
        );

      }

    },70);

}

function canvasRoundRect(
  ctx,
  x,
  y,
  w,
  h,
  r
){

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.lineTo(x+w-r,y);

  ctx.quadraticCurveTo(
    x+w,y,
    x+w,y+r
  );

  ctx.lineTo(
    x+w,
    y+h-r
  );

  ctx.quadraticCurveTo(
    x+w,y+h,
    x+w-r,y+h
  );

  ctx.lineTo(
    x+r,
    y+h
  );

  ctx.quadraticCurveTo(
    x,y+h,
    x,y+h-r
  );

  ctx.lineTo(
    x,y+r
  );

  ctx.quadraticCurveTo(
    x,y,
    x+r,y
  );

  ctx.closePath();

}



function saveAsImage(){

  var canvas=
    $("exportCanvas");

  var cellW=170;

  var cellH=105;

  var gap=12;

  var margin=45;

  var boardW=
    cols*cellW+
    (cols-1)*gap;

  var boardH=
    rows*cellH+
    (rows-1)*gap;

  canvas.width=
    boardW+margin*2;

  canvas.height=
    boardH+
    margin*2+
    80;


  var ctx=
    canvas.getContext("2d");


  ctx.fillStyle="#ffffff";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.fillStyle="#333";

  ctx.font=
    "bold 30px sans-serif";

  ctx.textAlign="center";

  ctx.fillText(
    "席替え後の座席表",
    canvas.width/2,
    45
  );


  for(var r=0;r<rows;r++){

    for(var c=0;c<cols;c++){

      var index=
        r*cols+c;

      var x=
        margin+
        c*(cellW+gap);

      var y=
        margin+
        35+
        r*(cellH+gap);


      var person=
        students[index];


      ctx.strokeStyle=
        "#333";

      ctx.lineWidth=2;

      canvasRoundRect(
        ctx,
        x,
        y,
        cellW,
        cellH,
        10
      );

      ctx.stroke();


      ctx.fillStyle=
        person.gender==="男"
          ? "#4a90e2"
          : person.gender==="女"
            ? "#e85b67"
            : "#333";


      ctx.font=
        "bold 22px sans-serif";

      ctx.textAlign="center";

      ctx.textBaseline="middle";


      ctx.fillText(
        person.name || "空席",
        x+cellW/2,
        y+cellH/2,
        cellW-20
      );

    }

  }


  var link=
    document.createElement("a");

  link.download=
    "席替え後の座席表.png";


  link.href=
    canvas.toDataURL(
      "image/png"
    );


  link.click();

}



$("saveBtn").onclick=
  saveAsImage;



$("shuffleBtn").onclick=
  function(){

    var result=
      generateArrangement();


    if(!result){

      $("status").textContent=
        "条件を満たす座席を作れませんでした。";

      return;

    }


    $("status").textContent=
      "席替えを準備しています…";


    renderPresentation(
      result
    );


    /*
     * 発表が終わった後に
     * 実際の座席表を更新。
     */
    setTimeout(function(){

      students=
        result.map(function(s){

          return {
            name:s.name,
            gender:s.gender
          };

        });


      render();

      saveState();


      $("status").textContent=
        "席替えが完了しました。";

    },
    (
      rows*cols*600
    )+
    1800
    );

  };



$("resetBtn").onclick=
  function(){

    render();

    $("status").textContent=
      "座席表を現在の状態に戻しました。";

  };



$("groupCols").onchange=
  function(){

    render();

    saveState();

  };



$("groupRows").onchange=
  function(){

    render();

    saveState();

  };



$("animation").onchange=
  saveState;



$("animationAxis").onchange=
  saveState;



$("moveAll").onchange=
  saveState;



$("fixGender").onchange=
  saveState;



/*
 * 初期化
 */

loadState();


fillSelect(
  "cols",
  6,
  cols
);


fillSelect(
  "rows",
  6,
  rows
);


if(
  localStorage.getItem(
    "changeSeatsMakerState"
  )
){

  try{

    var saved=
      JSON.parse(
        localStorage.getItem(
          "changeSeatsMakerState"
        )
      );


    if(saved.groupCols!==undefined){

      $("groupCols").value=
        saved.groupCols;

    }


    if(saved.groupRows!==undefined){

      $("groupRows").value=
        saved.groupRows;

    }


    if(saved.animation){

      $("animation").value=
        saved.animation;

    }


    if(saved.animationAxis){

      $("animationAxis").value=
        saved.animationAxis;

    }


    $("moveAll").checked=
      !!saved.moveAll;


    $("fixGender").checked=
      !!saved.fixGender;

  }catch(e){}

}


render();


})();
</script>

</body>
</html>
