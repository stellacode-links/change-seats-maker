<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>席替えメーカー</title>
<style>
:root{--yellow:#F5E342;--dark:#333;--line:#ddd;--blue:#4A90E2;--red:#E85B67}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;color:var(--dark);background:#fafafa}
button,input,select{font:inherit}
button{cursor:pointer}
.header{background:var(--yellow);padding:23px 16px;text-align:center;box-shadow:0 2px 8px #0002}
.header h1{margin:0;font-size:30px;font-weight:800}
.container{max-width:1100px;margin:auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 3px 15px #0000000a}
.title{font-size:21px;font-weight:800;margin:0 0 16px}
.front{width:min(650px,90%);margin:0 auto 16px;background:#eee;border-radius:7px;text-align:center;padding:7px;color:#666;font-size:13px}
.seat-wrap{overflow:auto;padding:5px}
.seat-grid{display:grid;justify-content:center;width:max-content;margin:auto}
.seat{width:92px;min-height:64px;border:2px solid #d6d6d6;background:#fff;border-radius:10px;color:#333;font-weight:700;padding:6px;overflow-wrap:anywhere}
.seat:hover{border-color:#c9b800}
.seat.empty{color:#999;font-weight:500}
.gap-r{margin-right:15px}.gap-b{margin-bottom:15px}
.setting-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{font-size:13px;font-weight:700;display:block}
select,input[type=number],input[type=text]{width:100%;margin-top:6px;padding:10px;border:1px solid #ccc;border-radius:9px;background:white;outline:none}
select:focus,input:focus{border-color:#c9b800;box-shadow:0 0 0 3px #f5e34255}
.sub{font-size:16px;font-weight:800;margin:25px 0 10px}
.rule-list{display:flex;flex-direction:column;gap:8px}
.rule{display:grid;gap:7px;align-items:end}
.rule.column{grid-template-columns:minmax(130px,1fr) 120px 120px 44px}
.rule.position{grid-template-columns:minmax(130px,1fr) 145px 145px 44px}
.rule.distance{grid-template-columns:minmax(130px,1fr) minmax(130px,1fr) 90px 80px 44px}
.rule.leader{grid-template-columns:minmax(130px,1fr) 44px}
.remove{height:42px;border:0;border-radius:9px;background:#eee;font-weight:800}
.add{margin-top:9px;border:0;background:#eee;border-radius:9px;padding:10px 14px;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.main-btn,.sub-btn{border:0;border-radius:11px;padding:13px 22px;font-weight:800}
.main-btn{background:var(--yellow)}.main-btn:hover{background:#d9c900}
.sub-btn{background:#eee}.sub-btn:hover{background:#ddd}
.check{display:flex;gap:9px;align-items:center;margin-top:12px;font-weight:600;font-size:14px}
.check input{width:19px;height:19px;margin:0;accent-color:#d3c300}
.status{text-align:center;color:#777;font-size:13px;margin-top:10px;min-height:20px}

/* 発表 */
.presentation{display:none;position:fixed;inset:0;background:#fff;z-index:10000;overflow:auto}
.presentation.show{display:block}
.presentation-head{height:72px;background:var(--yellow);display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:2}
.presentation-head h2{margin:0;font-size:24px}
.presentation-close{position:absolute;right:18px;top:15px;border:0;background:#fff;border-radius:10px;padding:10px 16px;font-weight:800}
.presentation-stage{min-height:calc(100vh - 72px);display:flex;align-items:center;justify-content:center;padding:35px}
.big-seat{width:min(850px,90vw);border:3px solid #ddd;border-radius:22px;text-align:center;padding:70px 25px;font-size:clamp(34px,7vw,80px);font-weight:900;animation:pop .22s ease}
.big-seat small{display:block;font-size:16px;color:#888;margin-bottom:15px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.presentation-table{display:grid;gap:8px;justify-content:center}
.presentation-table .seat{width:100px;min-height:65px}

/* 印刷 */
.print-options{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.print-btn{border:0;border-radius:10px;padding:11px 15px;background:#eee;font-weight:700}
#exportCanvas{display:none}
@media(max-width:750px){
 .container{padding:12px 9px}.card{padding:15px}
 .setting-grid{grid-template-columns:1fr}
 .rule.column,.rule.position,.rule.distance,.rule.leader{grid-template-columns:1fr 1fr}
 .remove{width:100%}
 .seat{width:72px;min-height:56px;font-size:12px}
}
@media print{
 body{background:white}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important;padding:25px}
}
#printArea{display:none}
.print-page-title{text-align:center;font-size:28px;font-weight:800;margin-bottom:20px}
.print-board{border:2px solid #333;padding:20px;display:inline-block;min-width:80%;margin-left:10%;margin-right:10%}
.print-blackboard{text-align:center;border:2px solid #333;padding:8px;margin-bottom:20px;font-weight:800}
.print-blackboard.bottom{margin-top:20px;margin-bottom:0}
.print-grid{display:grid;justify-content:center;gap:8px}
.print-seat{border:2px solid #333;border-radius:7px;min-width:80px;min-height:55px;padding:8px;text-align:center;font-weight:800;display:flex;align-items:center;justify-content:center}
.print-seat.male{color:var(--blue)}.print-seat.female{color:var(--red)}
</style>
</head>
<body>

<header class="header"><h1>席替えメーカー</h1></header>

<main class="container">
<section class="card">
<h2 class="title">座席表</h2>
<div class="front">黒板（前）</div>
<div class="seat-wrap"><div id="seatGrid" class="seat-grid"></div></div>
</section>

<section class="card">
<h2 class="title">設定</h2>

<h3 class="sub">座席数の指定</h3>
<div class="setting-grid">
<div class="field"><label>全体：横<select id="cols"></select></label></div>
<div class="field"><label>縦<select id="rows"></select></label></div>
</div>

<h3 class="sub">班</h3>
<div class="setting-grid">
<div class="field"><label>横<select id="groupCols"><option value="0">なし</option><option>2</option><option>3</option></select></label></div>
<div class="field"><label>縦<select id="groupRows"><option value="0">なし</option><option>2</option><option>3</option></select></label></div>
</div>

<h3 class="sub">列の指定</h3>
<div id="columnRules" class="rule-list"></div>

<h3 class="sub">位置の指定</h3>
<div id="positionRules" class="rule-list"></div>

<h3 class="sub">生徒同士を近づける</h3>
<div id="nearRules" class="rule-list"></div>

<h3 class="sub">生徒同士を離す</h3>
<div id="farRules" class="rule-list"></div>

<h3 class="sub">班長を指定する</h3>
<div id="leaderRules" class="rule-list"></div>
</section>

<section class="card">
<h2 class="title">演出</h2>
<div class="field">
<label>発表方法<select id="animation">
<option value="seat">一席ずつ</option>
<option value="row">横一列ずつ</option>
<option value="col">縦一列ずつ</option>
</select></label>
</div>
<label class="check"><input type="checkbox" id="moveAll">今の座席から全員移動させる</label>
<label class="check"><input type="checkbox" id="fixGender">男女の座席を固定する</label>
<div class="actions">
<button id="shuffleBtn" class="main-btn">席替えする！</button>
<button id="resetBtn" class="sub-btn">座席をリセット</button>
</div>
<div id="status" class="status"></div>
</section>

<section class="card">
<h2 class="title">保存・印刷</h2>
<p style="font-size:13px">席替え後の座席表を画像として保存したり、印刷できます。</p>
<div class="actions">
<button id="saveBtn" class="main-btn">画像として保存</button>
<button id="printTopBtn" class="sub-btn">印刷（黒板が上）</button>
<button id="printBottomBtn" class="sub-btn">印刷（黒板が下）</button>
</div>
</section>
</main>

<div id="presentation" class="presentation">
<div class="presentation-head"><h2>席替え発表</h2><button id="closePresentation" class="presentation-close">閉じる</button></div>
<div id="presentationStage" class="presentation-stage"></div>
</div>

<div id="printArea"></div>
<canvas id="exportCanvas"></canvas>

<script>
(function(){
"use strict";

var rows=6,cols=6;
var students=[]; // {name,gender}
for(var i=0;i<36;i++)students.push({name:"",gender:""});

function $(id){return document.getElementById(id)}
function fillSelect(id,max,selected){
 var s=$(id);s.innerHTML="";
 for(var i=1;i<=max;i++){var o=document.createElement("option");o.value=i;o.textContent=i;if(i===selected)o.selected=true;s.appendChild(o)}
}
fillSelect("cols",6,6);fillSelect("rows",6,6);

function names(){
 var a=[];
 students.forEach(function(s){if(s.name && a.indexOf(s.name)<0)a.push(s.name)});
 return a;
}
function studentSelect(){
 var s=document.createElement("select");s.className="student-select";
 var first=document.createElement("option");first.value="";first.textContent="生徒を選択";s.appendChild(first);
 names().forEach(function(n){var o=document.createElement("option");o.value=n;o.textContent=n;s.appendChild(o)});
 return s;
}
function refreshSelects(){
 document.querySelectorAll(".student-select").forEach(function(old){
  var v=old.value,n=studentSelect();n.value=v;old.parentNode.replaceChild(n,old);
 });
}

function render(){
 var grid=$("seatGrid");grid.innerHTML="";
 grid.style.gridTemplateColumns="repeat("+cols+",92px)";
 var gc=+$("groupCols").value,gr=+$("groupRows").value;
 for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
  var idx=r*cols+c,b=document.createElement("button");b.type="button";b.className="seat";
  b.textContent=students[idx].name||"空席";
  if(!students[idx].name)b.className+=" empty";
  if(gc&&(c+1)%gc===0&&c<cols-1)b.className+=" gap-r";
  if(gr&&(r+1)%gr===0&&r<rows-1)b.className+=" gap-b";
  (function(i){
   b.onclick=function(){
    var current=students[i];
    var name=prompt("名前を入力してください。\\n空欄で空席になります。",current.name);
    if(name===null)return;
    name=name.trim();
    if(!name){students[i]={name:"",gender:""};render();refreshSelects();return}
    var gender=prompt("性別を入力してください。\\n「男」または「女」を入力（任意）",current.gender);
    if(gender===null)gender=current.gender;
    gender=gender.trim();
    if(gender!=="男"&&gender!=="女")gender="";
    students[i]={name:name,gender:gender};
    render();refreshSelects();
   };
  })(idx);
  grid.appendChild(b);
 }
}

function removeButton(parent,rule){
 var x=document.createElement("button");x.type="button";x.className="remove";x.textContent="×";x.onclick=function(){parent.removeChild(rule)};return x;
}
function addColumnRule(){
 var p=$("columnRules"),r=document.createElement("div");r.className="rule column";
 var s=studentSelect(),dir=document.createElement("select");
 dir.innerHTML="<option value='front'>前から</option><option value='back'>後ろから</option>";
 var n=document.createElement("select");
 for(var i=1;i<=rows;i++){var o=document.createElement("option");o.value=i;o.textContent=i+"列目まで";n.appendChild(o)}
 r.append(s,dir,n,removeButton(p,r));p.appendChild(r);
}
function addPositionRule(){
 var p=$("positionRules"),r=document.createElement("div");r.className="rule position";
 var s=studentSelect(),a=document.createElement("select"),b=document.createElement("select");
 for(var i=1;i<=rows;i++){var o=document.createElement("option");o.value=i;o.textContent="前から"+i+"列目";a.appendChild(o)}
 for(var j=1;j<=cols;j++){var q=document.createElement("option");q.value=j;q.textContent="横から"+j+"列目";b.appendChild(q)}
 r.append(s,a,b,removeButton(p,r));p.appendChild(r);
}
function addDistanceRule(id,text){
 var p=$(id),r=document.createElement("div");r.className="rule distance";
 var a=studentSelect(),b=studentSelect(),n=document.createElement("input");n.type="number";n.min=0;n.max=36;n.value=1;
 var label=document.createElement("div");label.textContent=text;label.style.paddingBottom="12px";label.style.fontSize="12px";
 r.append(a,b,n,label,removeButton(p,r));p.appendChild(r);
}
function addLeaderRule(){
 var p=$("leaderRules"),r=document.createElement("div");r.className="rule leader";
 r.append(studentSelect(),removeButton(p,r));p.appendChild(r);
}

/* 最初から各条件を1つ表示 */
addColumnRule();addPositionRule();addDistanceRule("nearRules","席以下");addDistanceRule("farRules","席以上空ける");addLeaderRule();

$("cols").onchange=function(){resizeSeats(+this.value,rows)}
$("rows").onchange=function(){resizeSeats(cols,+this.value)}
$("groupCols").onchange=render;$("groupRows").onchange=render;

function resizeSeats(nc,nr){
 var next=[];for(var i=0;i<nc*nr;i++)next.push({name:"",gender:""});
 for(var r=0;r<Math.min(rows,nr);r++)for(var c=0;c<Math.min(cols,nc);c++)next[r*nc+c]=students[r*cols+c];
 cols=nc;rows=nr;students=next;render();refreshSelects();updatePositionOptions();
}
function updatePositionOptions(){
 document.querySelectorAll("#positionRules .position").forEach(function(r){
  var ss=r.querySelectorAll("select");if(ss.length<3)return;
  var av=ss[1].value,bv=ss[2].value;
  ss[1].innerHTML="";for(var i=1;i<=rows;i++){var o=document.createElement("option");o.value=i;o.textContent="前から"+i+"列目";ss[1].appendChild(o)}
  ss[1].value=Math.min(+av,rows);
  ss[2].innerHTML="";for(var j=1;j<=cols;j++){var q=document.createElement("option");q.value=j;q.textContent="横から"+j+"列目";ss[2].appendChild(q)}
  ss[2].value=Math.min(+bv,cols);
 });
}

function getPositionRules(){
 var out=[];
 document.querySelectorAll("#positionRules .position").forEach(function(r){
  var s=r.querySelectorAll("select");if(s.length<3||!s[0].value)return;
  out.push({name:s[0].value,index:(+s[1].value-1)*cols+(+s[2].value-1)});
 });
 return out;
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

function makeResult(){
 var people=students.filter(function(s){return s.name});
 if(!people.length){alert("先に座席へ名前を入力してください。");return null}
 var result=Array(rows*cols).fill(null),fixed={};
 var pos=getPositionRules();
 for(var i=0;i<pos.length;i++){
  if(result[pos[i].index]||fixed[pos[i].name])return null;
  var person=people.find(function(x){return x.name===pos[i].name});
  if(person){result[pos[i].index]=person;fixed[pos[i].name]=true}
 }
 var rest=people.filter(function(p){return !fixed[p.name]});
 var empty=[];for(var j=0;j<result.length;j++)if(!result[j])empty.push(j);
 rest=shuffle(rest);empty=shuffle(empty);
 for(var k=0;k<rest.length&&k<empty.length;k++)result[empty[k]]=rest[k];
 return result;
}

function startPresentation(result){
 var overlay=$("presentation"),stage=$("presentationStage");stage.innerHTML="";overlay.classList.add("show");
 var mode=$("animation").value;
 if(mode==="seat"){
  var order=[];for(var i=0;i<result.length;i++)order.push(i);
  var n=0,t=setInterval(function(){
   if(n>=order.length){clearInterval(t);return}
   var p=result[order[n]],box=document.createElement("div");box.className="big-seat";
   box.innerHTML="<small>座席 "+(order[n]+1)+"</small>"+(p?p.name:"空席");
   stage.innerHTML="";stage.appendChild(box);n++;
  },650);
 }else{
  var axis=mode==="row"?"row":"col",step=0;
  var t2=setInterval(function(){
   if(step>=(axis==="row"?rows:cols)){clearInterval(t2);return}
   var box=document.createElement("div");box.className="presentation-table";
   var count=axis==="row"?cols:rows;box.style.gridTemplateColumns="repeat("+count+",100px)";
   for(var i=0;i<count;i++){
    var idx=axis==="row"?step*cols+i:i*cols+step,p=result[idx],b=document.createElement("div");b.className="seat";b.textContent=p?p.name:"空席";box.appendChild(b)
   }
   stage.innerHTML="";stage.appendChild(box);step++;
  },850);
 }
}
$("closePresentation").onclick=function(){$("presentation").classList.remove("show")};

$("shuffleBtn").onclick=function(){
 var result=makeResult();if(!result)return;
 startPresentation(result);
 students=result.map(function(x){return x||{name:"",gender:""}});
 setTimeout(function(){render();refreshSelects();$("status").textContent="席替えが完了しました！"},200);
};
$("resetBtn").onclick=function(){
 if(!confirm("座席の名前をすべて消しますか？"))return;
 students=[];for(var i=0;i<rows*cols;i++)students.push({name:"",gender:""});
 render();refreshSelects();$("status").textContent="リセットしました。";
};

/* 画像保存：Canvasで生成 */
function drawSeatImage(){
 var scale=2,pad=50,cellW=130,cellH=90,gap=12;
 var w=pad*2+cols*cellW+(cols-1)*gap,h=pad*2+rows*cellH+(rows-1)*gap+70;
 var canvas=$("exportCanvas");canvas.width=w*scale;canvas.height=h*scale;
 var ctx=canvas.getContext("2d");ctx.scale(scale,scale);
 ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);
 ctx.fillStyle="#F5E342";ctx.fillRect(0,0,w,70);
 ctx.fillStyle="#333";ctx.font="bold 28px sans-serif";ctx.textAlign="center";ctx.fillText("席替えメーカー",w/2,45);
 ctx.fillStyle="#eee";ctx.fillRect(pad,85,w-pad*2,28);ctx.fillStyle="#666";ctx.font="14px sans-serif";ctx.fillText("黒板（前）",w/2,104);
 for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
  var x=pad+c*(cellW+gap),y=130+r*(cellH+gap),p=students[r*cols+c];
  ctx.strokeStyle="#333";ctx.lineWidth=2;ctx.strokeRect(x,y,cellW,cellH);
  ctx.fillStyle=p.gender==="男"?"#4A90E2":p.gender==="女"?"#E85B67":"#333";
  ctx.font="bold 18px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(p.name||"空席",x+cellW/2,y+cellH/2,cellW-12);
 }
 return canvas;
}
$("saveBtn").onclick=function(){
 var canvas=drawSeatImage(),a=document.createElement("a");a.download="席替え_"+Date.now()+".png";a.href=canvas.toDataURL("image/png");a.click();
};

/* 印刷 */
function printSeats(bottom){
 var area=$("printArea");area.innerHTML="";
 var title=document.createElement("div");title.className="print-page-title";title.textContent="席替え表";area.appendChild(title);
 var board=document.createElement("div");board.className="print-board";
 function black(){var b=document.createElement("div");b.className="print-blackboard"+(bottom?" bottom":"");b.textContent="黒板";return b}
 if(!bottom)board.appendChild(black());
 var grid=document.createElement("div");grid.className="print-grid";grid.style.gridTemplateColumns="repeat("+cols+",80px)";
 for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
  var p=students[r*cols+c],d=document.createElement("div");d.className="print-seat "+(p.gender==="男"?"male":p.gender==="女"?"female":"");d.textContent=p.name||"空席";grid.appendChild(d);
 }
 board.appendChild(grid);if(bottom)board.appendChild(black());area.appendChild(board);
 setTimeout(function(){window.print()},100);
}
$("printTopBtn").onclick=function(){printSeats(false)}
$("printBottomBtn").onclick=function(){printSeats(true)}

render();
})();
</script>
</body>
</html>
