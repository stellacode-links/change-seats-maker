<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>席替えメーカー</title>

<style>
:root{
  --yellow:#f5e342;
  --dark:#333;
  --line:#ddd;
  --blue:#4a90e2;
  --red:#e85b67;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;
  color:var(--dark);
  background:#fafafa;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

.header{
  background:var(--yellow);
  padding:23px 16px;
  text-align:center;
  box-shadow:0 2px 8px #0002;
}
.header h1{
  margin:0;
  font-size:30px;
  font-weight:800;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 3px 15px #0000000a;
}

.title{
  font-size:21px;
  font-weight:800;
  margin:0 0 16px;
}

.sub{
  font-size:16px;
  font-weight:800;
  margin:25px 0 10px;
}

.front{
  width:min(650px,90%);
  margin:0 auto 16px;
  background:#eee;
  border-radius:7px;
  text-align:center;
  padding:7px;
  color:#666;
  font-size:13px;
}

.seat-wrap{overflow:auto;padding:5px}

.seat-grid{
  display:grid;
  justify-content:center;
  width:max-content;
  margin:auto;
}

.seat{
  width:92px;
  min-height:64px;
  border:2px solid #d6d6d6;
  background:#fff;
  border-radius:10px;
  color:#333;
  font-weight:700;
  padding:6px;
  overflow-wrap:anywhere;
  transition:.15s;
}

.seat:hover{
  border-color:#c9b800;
  transform:translateY(-1px);
}

.seat.empty{
  color:#999;
  font-weight:500;
}

.seat.male{color:var(--blue)}
.seat.female{color:var(--red)}

.gap-r{margin-right:15px}
.gap-b{margin-bottom:15px}

.setting-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.field label{
  font-size:13px;
  font-weight:700;
  display:block;
}

select,
input[type=number],
input[type=text],
textarea{
  width:100%;
  margin-top:6px;
  padding:10px;
  border:1px solid #ccc;
  border-radius:9px;
  background:white;
  outline:none;
}

textarea{
  resize:vertical;
  min-height:130px;
  line-height:1.7;
}

.bulk-example{
  color:#aaa;
  font-size:13px;
  line-height:1.7;
  margin-top:7px;
}

.bulk-btn,.add,.remove{
  border:0;
  background:#eee;
  border-radius:9px;
  padding:10px 14px;
  font-weight:700;
}

.bulk-btn{
  margin-top:10px;
}

.bulk-btn:hover,.add:hover,.remove:hover{background:#ddd}

.rule-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

#nearRules,#farRules{margin-bottom:14px}

#nearRules + .add,
#farRules + .add{
  margin-top:4px;
}

#nearRules .remove,
#farRules .remove{
  margin-left:8px;
}

.rule{
  display:grid;
  gap:7px;
  align-items:end;
}

.rule.column{
  grid-template-columns:minmax(130px,1fr) 120px 120px 44px;
}

.rule.position{
  grid-template-columns:minmax(130px,1fr) 145px 145px 44px;
}

.rule.distance{
  grid-template-columns:minmax(130px,1fr) minmax(130px,1fr) 90px 100px 44px;
}

.rule.leader{
  grid-template-columns:minmax(130px,1fr) 44px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:18px;
}

.main-btn,.sub-btn{
  border:0;
  border-radius:11px;
  padding:13px 22px;
  font-weight:800;
}

.main-btn{background:var(--yellow)}
.main-btn:hover{background:#d9c900}

.sub-btn{background:#eee}
.sub-btn:hover{background:#ddd}

.check{
  display:flex;
  gap:9px;
  align-items:center;
  margin-top:12px;
  font-weight:600;
  font-size:14px;
}

.check input{
  width:19px;
  height:19px;
  margin:0;
  accent-color:#d3c300;
}

.status{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-top:10px;
  min-height:20px;
}

.gender-columns{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:10px;
}

.gender-column{
  border:1px solid #ddd;
  border-radius:12px;
  padding:10px;
  min-width:105px;
  background:#fafafa;
}

.gender-column-title{
  text-align:center;
  font-size:13px;
  font-weight:800;
  margin-bottom:8px;
}

.gender-switch{
  display:flex;
  border-radius:999px;
  background:#eee;
  padding:3px;
  gap:2px;
}

.gender-switch button{
  flex:1;
  border:0;
  background:transparent;
  border-radius:999px;
  padding:7px 5px;
  font-size:12px;
  font-weight:800;
}

.gender-switch button.active.male{
  background:var(--blue);
  color:white;
}

.gender-switch button.active.female{
  background:var(--red);
  color:white;
}

.gender-switch button.active.none{
  background:#777;
  color:white;
}

/* モーダル */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:20000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{display:flex}

.modal-box{
  width:min(430px,100%);
  background:white;
  border-radius:18px;
  padding:22px;
  box-shadow:0 15px 50px #0004;
}

.modal-box h3{margin:0 0 18px}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.modal-actions button{
  flex:1;
  border:0;
  border-radius:10px;
  padding:12px;
  font-weight:800;
}

/* 続き */

.presentation{
  display:none;
  position:fixed;
  inset:0;
  background:#fff;
  z-index:10000;
  overflow:auto;
}

.presentation.show{display:block}

.presentation-head{
  height:72px;
  background:var(--yellow);
  display:flex;
  align-items:center;
  justify-content:center;
  position:sticky;
  top:0;
  z-index:2;
}

.presentation-head h2{
  margin:0;
  font-size:24px;
}

.presentation-close{
  position:absolute;
  right:18px;
  top:15px;
  border:0;
  background:#fff;
  border-radius:10px;
  padding:10px 16px;
  font-weight:800;
}

.presentation-stage{
  min-height:calc(100vh - 72px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:35px;
}

.presentation-board{
  width:min(1200px,96vw);
}

.presentation-front{
  background:#eee;
  border-radius:8px;
  padding:9px;
  text-align:center;
  color:#666;
  font-size:14px;
  margin-bottom:22px;
}

.presentation-table{
  display:grid;
  justify-content:center;
  gap:8px;
}

.presentation-seat{
  width:100px;
  min-height:68px;
  border:2px solid #d6d6d6;
  background:white;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:7px;
  font-weight:800;
  overflow-wrap:anywhere;
  transition:.2s;
}

.presentation-seat.hidden-seat{
  background:#111;
  border-color:#111;
  color:#111;
}

.presentation-seat.revealed{
  animation:seatPop .28s ease;
}

.presentation-seat.male{color:var(--blue)}
.presentation-seat.female{color:var(--red)}

@keyframes seatPop{
  from{transform:scale(.75);opacity:0}
  to{transform:scale(1);opacity:1}
}

.slot-seat{
  animation:slotFlash .12s linear infinite;
}

@keyframes slotFlash{
  0%{transform:scale(.97)}
  50%{transform:scale(1.03)}
  100%{transform:scale(.97)}
}

/* 印刷 */
#printArea{display:none}

.print-page-title{
  text-align:center;
  font-size:28px;
  font-weight:800;
  margin-bottom:20px;
}

.print-board{
  border:2px solid #333;
  padding:20px;
  display:inline-block;
  min-width:80%;
  margin-left:10%;
  margin-right:10%;
}

.print-blackboard{
  text-align:center;
  border:2px solid #333;
  padding:8px;
  margin-bottom:20px;
  font-weight:800;
}

.print-blackboard.bottom{
  margin-top:20px;
  margin-bottom:0;
}

.print-grid{
  display:grid;
  justify-content:center;
  gap:8px;
}

.print-seat{
  border:2px solid #333;
  border-radius:7px;
  min-width:80px;
  min-height:55px;
  padding:8px;
  text-align:center;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
}

.print-seat.male{color:var(--blue)}
.print-seat.female{color:var(--red)}

@media(max-width:750px){
  .container{padding:12px 9px}
  .card{padding:15px}
  .setting-grid{grid-template-columns:1fr}

  .rule.column,
  .rule.position,
  .rule.distance,
  .rule.leader{
    grid-template-columns:1fr 1fr;
  }

  .remove{width:100%}

  .seat{
    width:72px;
    min-height:56px;
    font-size:12px;
  }

  .presentation-stage{padding:15px}

  .presentation-seat{
    width:70px;
    min-height:55px;
    font-size:12px;
  }
}

@media print{
  body{background:white}

  body>*:not(#printArea){
    display:none!important;
  }

  #printArea{
    display:block!important;
    padding:25px;
  }
}
</style>
</head>

<body>

<header class="header">
  <h1>席替えメーカー</h1>
</header>

<main class="container">

<section class="card">

<h2 class="title">座席表</h2>

<div class="front">黒板（前）</div>

<div class="seat-wrap">
  <div id="seatGrid" class="seat-grid"></div>
</div>

<h3 class="sub">一括入力</h3>

<textarea
  id="bulkInput"
  placeholder="田中　佐藤　空席　山田&#10;高橋　橋本　鈴木　空席"
></textarea>

<div class="bulk-example">
  例：田中　佐藤　空席　山田<br>
  　　高橋　橋本　鈴木　空席
</div>

<button id="bulkBtn" class="bulk-btn">
  一括入力する
</button>

<br>

<button id="clearSeatsBtn" class="bulk-btn">
  座席表をクリア
</button>

<h3 class="sub">列ごとの男女</h3>

<div id="genderColumns" class="gender-columns"></div>

</section>


<section class="card">

<h2 class="title">設定</h2>

<h3 class="sub">座席数の指定</h3>

<div class="setting-grid">

<div class="field">
<label>
全体：横
<select id="cols"></select>
</label>
</div>

<div class="field">
<label>
縦
<select id="rows"></select>
</label>
</div>

</div>

<h3 class="sub">班</h3>

<div class="setting-grid">

<div class="field">
<label>
横
<select id="groupCols">
<option value="0">なし</option>
<option value="2">2</option>
<option value="3">3</option>
</select>
</label>
</div>

<div class="field">
<label>
縦
<select id="groupRows">
<option value="0">なし</option>
<option value="2">2</option>
<option value="3">3</option>
</select>
</label>
</div>

</div>

<h3 class="sub">列の指定</h3>
<div id="columnRules" class="rule-list"></div>

<button id="addColumn" class="add">＋ 条件を追加</button>

<h3 class="sub">位置の指定</h3>
<div id="positionRules" class="rule-list"></div>

<button id="addPosition" class="add">＋ 条件を追加</button>

<h3 class="sub">生徒同士を近づける</h3>
<div id="nearRules" class="rule-list"></div>

<button id="addNear" class="add">＋ 条件を追加</button>

<h3 class="sub">生徒同士を離す</h3>
<div id="farRules" class="rule-list"></div>

<button id="addFar" class="add">＋ 条件を追加</button>

<h3 class="sub">班長を指定する</h3>
<div id="leaderRules" class="rule-list"></div>

<button id="addLeader" class="add">＋ 条件を追加</button>

</section>


<section class="card">

<h2 class="title">演出</h2>

<div class="setting-grid">

<div class="field">
<label>
演出
<select id="animation">
<option value="normal">通常</option>
<option value="slot">スロット</option>
</select>
</label>
</div>

<div class="field">
<label>
<select id="animationAxis">
<option value="row">横</option>
<option value="col">縦</option>
</select>
</label>
</div>

</div>

<label class="check">
<input type="checkbox" id="moveAll">
今の座席から全員移動させる
</label>

<label class="check">
<input type="checkbox" id="fixGender">
男女の座席を固定する
</label>

<label class="check">
<input type="checkbox" id="fixEmpty">
空席の位置を固定する
</label>

<div class="actions">

<button id="shuffleBtn" class="main-btn">
席替えする！
</button>

<button id="resetBtn" class="sub-btn">
座席をリセット
</button>

</div>

<div id="status" class="status"></div>

</section>


<section class="card">

<h2 class="title">保存・印刷</h2>

<p style="font-size:13px">
席替え後の座席表を画像として保存したり、印刷できます。
</p>

<div class="actions">

<button id="saveBtn" class="main-btn">
画像として保存
</button>

<button id="printTopBtn" class="sub-btn">
印刷（黒板が上）
</button>

<button id="printBottomBtn" class="sub-btn">
印刷（黒板が下）
</button>

</div>

</section>

</main>


<div id="inputModal" class="modal">

<div class="modal-box">

<h3>座席を編集</h3>

<div class="field">
<label>
名前
<input type="text" id="modalName">
</label>
</div>

<div class="field" style="margin-top:12px">
<label>
男女
<select id="modalGender">
<option value="">指定なし</option>
<option value="男">男</option>
<option value="女">女</option>
</select>
</label>
</div>

<div class="modal-actions">

<button id="modalCancel" class="sub-btn">
キャンセル
</button>

<button id="modalSave" class="main-btn">
保存
</button>

</div>

</div>
</div>


<div id="presentation" class="presentation">

<div class="presentation-head">

<h2>席替え</h2>

<button id="closePresentation" class="presentation-close">
閉じる
</button>

</div>

<div id="presentationStage" class="presentation-stage"></div>

</div>


<div id="printArea"></div>

<canvas id="exportCanvas" style="display:none"></canvas>


<script>
(function(){

"use strict";

var rows=6;
var cols=6;

var students=[];

var seatGender=[];

var columnGenders=[];

var currentEditingIndex=-1;

var beforeShuffleStudents=null;


/* 初期状態 */
for(var i=0;i<36;i++){

  students.push({
    name:"",
    gender:""
  });

  seatGender.push("");

}

for(var c=0;c<6;c++){
  columnGenders.push("");
}


function $(id){
  return document.getElementById(id);
}


function cloneStudents(arr){

  return arr.map(function(s){

    return {
      name:s.name || "",
      gender:s.gender || ""
    };

  });

}


function fillSelect(id,max,selected){

  var s=$(id);

  s.innerHTML="";

  for(var i=1;i<=max;i++){

    var o=document.createElement("option");

    o.value=i;
    o.textContent=i;

    if(i===selected){
      o.selected=true;
    }

    s.appendChild(o);

  }

}


function saveState(){

  try{

    var state={

      rows:rows,
      cols:cols,

      students:students,

      seatGender:seatGender,

      columnGenders:columnGenders,

      beforeShuffleStudents:
        beforeShuffleStudents,

      groupCols:$("groupCols").value,
      groupRows:$("groupRows").value,

      animation:$("animation").value,
      animationAxis:$("animationAxis").value,

      moveAll:$("moveAll").checked,
      fixGender:$("fixGender").checked,
      fixEmpty:$("fixEmpty").checked

    };

    localStorage.setItem(
      "changeSeatsMakerState",
      JSON.stringify(state)
    );

  }catch(e){}

}


function loadState(){

  try{

    var raw=
      localStorage.getItem(
        "changeSeatsMakerState"
      );

    if(!raw){
      return;
    }

    var data=JSON.parse(raw);

    if(
      typeof data.rows==="number" &&
      typeof data.cols==="number"
    ){

      rows=data.rows;
      cols=data.cols;

    }

    if(Array.isArray(data.students)){
      students=data.students;
    }

    if(Array.isArray(data.seatGender)){
      seatGender=data.seatGender;
    }

    while(seatGender.length<rows*cols){
      seatGender.push("");
    }

    seatGender=
      seatGender.slice(0,rows*cols);

    if(Array.isArray(data.columnGenders)){
      columnGenders=
        data.columnGenders.slice(0,cols);
    }

    while(columnGenders.length<cols){
      columnGenders.push("");
    }

    while(students.length<rows*cols){

      students.push({
        name:"",
        gender:""
      });

    }

    students=
      students.slice(0,rows*cols);


    if(Array.isArray(data.beforeShuffleStudents)){

      beforeShuffleStudents=
        data.beforeShuffleStudents;

    }

  }catch(e){}

}


function names(){

  var result=[];

  students.forEach(function(s){

    if(
      s.name &&
      result.indexOf(s.name)<0
    ){

      result.push(s.name);

    }

  });

  return result;

}


function studentSelect(){

  var s=document.createElement("select");

  s.className="student-select";

  var first=document.createElement("option");

  first.value="";

  first.textContent="生徒を選択";

  s.appendChild(first);

  names().forEach(function(name){

    var o=document.createElement("option");

    o.value=name;

    o.textContent=name;

    s.appendChild(o);

  });

  return s;

}


function refreshSelects(){

  document
    .querySelectorAll(".student-select")
    .forEach(function(old){

      var value=old.value;

      var replacement=studentSelect();

      replacement.value=value;

      old.parentNode.replaceChild(
        replacement,
        old
      );

    });

}


function render(){

  var grid=$("seatGrid");

  grid.innerHTML="";

  grid.style.gridTemplateColumns=
    "repeat("+cols+",92px)";

  var groupCols=
    +$("groupCols").value;

  var groupRows=
    +$("groupRows").value;


  for(var r=0;r<rows;r++){

    for(var c=0;c<cols;c++){

      var index=r*cols+c;

      var seat=
        document.createElement("button");

      seat.type="button";

      seat.className="seat";

      var person=students[index];

      seat.textContent=
        person.name || "空席";

      if(!person.name){
        seat.classList.add("empty");
      }

      if(person.gender==="男"){
        seat.classList.add("male");
      }

      if(person.gender==="女"){
        seat.classList.add("female");
      }


      if(
        groupCols &&
        (c+1)%groupCols===0 &&
        c<cols-1
      ){

        seat.classList.add("gap-r");

      }


      if(
        groupRows &&
        (r+1)%groupRows===0 &&
        r<rows-1
      ){

        seat.classList.add("gap-b");

      }


      (function(i){

        seat.onclick=function(){

          openSeatModal(i);

        };

      })(index);


      grid.appendChild(seat);

    }

  }


  renderGenderColumns();

}


function openSeatModal(index){

  currentEditingIndex=index;

  $("modalName").value=
    students[index].name || "";

  $("modalGender").value=
    students[index].gender || "";

  $("inputModal").classList.add("show");

  setTimeout(function(){

    $("modalName").focus();

  },50);

}


$("modalCancel").onclick=function(){

  $("inputModal")
    .classList.remove("show");

};


$("modalSave").onclick=function(){

  if(currentEditingIndex<0){
    return;
  }

  students[currentEditingIndex]={

    name:$("modalName").value.trim(),

    gender:$("modalGender").value

  };

  $("inputModal")
    .classList.remove("show");

  render();

  refreshSelects();

  saveState();

};


$("inputModal").addEventListener(
  "click",
  function(e){

    if(e.target===this){

      this.classList.remove("show");

    }

  }
);


function renderGenderColumns(){

  var area=$("genderColumns");

  area.innerHTML="";


  while(columnGenders.length<cols){
    columnGenders.push("");
  }


  for(var c=0;c<cols;c++){

    var box=document.createElement("div");

    box.className="gender-column";


    var title=document.createElement("div");

    title.className="gender-column-title";

    title.textContent=
      (c+1)+"列目";

    box.appendChild(title);


    var sw=document.createElement("div");

    sw.className="gender-switch";


    var none=document.createElement("button");

    none.type="button";
    none.textContent="指定なし";
    none.className="none";


    var male=document.createElement("button");

    male.type="button";
    male.textContent="男";
    male.className="male";


    var female=document.createElement("button");

    female.type="button";

  students=[];

  for(var i=0;i<newCount;i++){

    if(oldStudents[i]){

      students.push({

        gender:oldStudents[i].gender || ""
      });

      });

  }

  columnGenders=
    columnGenders.slice(0,cols);

  while(columnGenders.length<cols){

/* ================================
   条件取得
================================ */

function getRuleValues(){

  var result={
    column:[],
    position:[],
    near:[],
    far:[],
    leader:[]
  };


  document
    .querySelectorAll("#columnRules .rule")
    .forEach(function(rule){

      var selects=
        rule.querySelectorAll("select");

      result.column.push({

        name:selects[0].value,

        direction:selects[1].value,

        number:parseInt(
          selects[2].value,
          10
        )

      });

    });


  document
    .querySelectorAll("#positionRules .rule")
    .forEach(function(rule){

      var selects=
        rule.querySelectorAll("select");

      result.position.push({

        name:selects[0].value,

        row:parseInt(
          selects[1].value,
          10
        ),

        col:parseInt(
          selects[2].value,
          10
        )

      });

    });


  document
    .querySelectorAll("#nearRules .rule")
    .forEach(function(rule){

      var selects=
        rule.querySelectorAll("select");

      var input=
        rule.querySelector("input");

      result.near.push({

        a:selects[0].value,

        b:selects[1].value,

        distance:parseInt(
          input.value,
          10
        ) || 0

      });

    });


  document
    .querySelectorAll("#farRules .rule")
    .forEach(function(rule){

      var selects=
        rule.querySelectorAll("select");

      var input=
        rule.querySelector("input");

      result.far.push({

        a:selects[0].value,

        b:selects[1].value,

        distance:parseInt(
          input.value,
          10
        ) || 0

      });

    });


  document
    .querySelectorAll("#leaderRules .rule")
    .forEach(function(rule){

      var select=
        rule.querySelector("select");

      if(select.value){

        result.leader.push(
          select.value
        );

      }

    });


  return result;

}


/* ================================
   名前 → 現在位置
================================ */

function findStudent(name,arr){

  for(var i=0;i<arr.length;i++){

    if(
      arr[i] &&
      arr[i].name===name
    ){

      return i;

    }

  }

  return -1;

}


/* ================================
   行・列
================================ */

function rowOf(index){

  return Math.floor(index/cols);

}


function colOf(index){

  return index%cols;

}


/* ================================
   座席間距離
================================ */

function seatDistance(a,b){

  var ar=rowOf(a);
  var ac=colOf(a);

  var br=rowOf(b);
  var bc=colOf(b);

  /*
    座席間の距離を
    縦横の差の合計として扱う
  */

  return Math.abs(ar-br)+Math.abs(ac-bc);

}


/* ================================
   男女固定用
================================ */

function genderOfStudent(person){

  return person.gender || "";

}


function makeGenderPools(arr){

  var pools={
    "男":[],
    "女":[],
    "":[],
    "empty":[]
  };


  for(var i=0;i<arr.length;i++){

    var p=arr[i];

    if(!p || !p.name){

      pools.empty.push(i);

    }else{

      var g=
        genderOfStudent(p);

      if(g==="男"){

        pools["男"].push(i);

      }else if(g==="女"){

        pools["女"].push(i);

      }else{

        pools[""].push(i);

      }

    }

  }


  return pools;

}


/* ================================
   列男女固定
================================ */

function allowedGenderForColumn(c){

  if(
    columnGenders[c]==="男" ||
    columnGenders[c]==="女"
  ){

    return columnGenders[c];

  }

  return "";

}


/* ================================
   シャッフル
================================ */

function shuffleArray(arr){

  var a=arr.slice();

  for(var i=a.length-1;i>0;i--){

    var j=
      Math.floor(
        Math.random()*(i+1)
      );

    var temp=a[i];

    a[i]=a[j];

    a[j]=temp;

  }

  return a;

}


/* ================================
   候補生成
================================ */

function createCandidate(){

  var original=
    cloneStudents(students);

  var result=
    new Array(rows*cols);

  for(var i=0;i<result.length;i++){

    result[i]={
      name:"",
      gender:""
    };

  }


  var used=
    new Array(original.length)
      .fill(false);


  /*
    空席固定
  */

  if($("fixEmpty").checked){

    for(var e=0;e<original.length;e++){

      if(!original[e].name){

        result[e]={
          name:"",
          gender:""
        };

        used[e]=true;

      }

    }

  }


  /*
    男女固定
    → 男子は男子として指定された席から
       女子は女子として指定された席から選ぶ
  */

  if($("fixGender").checked){

    var pools=
      makeGenderPools(original);


    for(var c=0;c<cols;c++){

      var required=
        allowedGenderForColumn(c);

      if(
        required!==""
      ){

        var pool=
          shuffleArray(
            pools[required]
          );

        for(var r=0;r<rows;r++){

          var idx=r*cols+c;

          if(used[idx])continue;

          if(pool.length){

            var source=
              pool.shift();

            if(!used[source]){

              result[idx]={
                name:
                  original[source].name,
                gender:
                  original[source].gender
              };

              used[source]=true;

            }

          }

        }

      }

    }

  }


  /*
    まだ配置されていない生徒
  */

  var remaining=[];

  for(var s=0;s<original.length;s++){

    if(!used[s]){

      remaining.push(s);

    }

  }


  remaining=
    shuffleArray(remaining);


  /*
    残りの席へ配置
  */

  for(var target=0;
      target<result.length;
      target++){

    if(used[target])continue;

    if(result[target].name)continue;

    if(!remaining.length)break;


    var chosen=-1;


    /*
      列男女指定がある場合、
      その性別を優先
    */

    var requiredGender=
      allowedGenderForColumn(
        colOf(target)
      );


    if(requiredGender){

      for(var q=0;q<remaining.length;q++){

        var sourceIndex=
          remaining[q];

        if(
          original[sourceIndex].gender===
          requiredGender
        ){

          chosen=q;
          break;

        }

      }

    }


    if(chosen<0){

      chosen=0;

    }


    var source=
      remaining.splice(
        chosen,
        1
      )[0];


    result[target]={
      name:
        original[source].name,

      gender:
        original[source].gender
    };

  }


  return result;

    }
  /* ================================
   条件を満たしているか確認
================================ */

function checkColumnRules(candidate,rules){

  for(var i=0;i<rules.column.length;i++){

    var rule=rules.column[i];

    if(!rule.name)continue;

    var index=findStudent(
      rule.name,
      candidate
    );

    if(index<0)return false;

    var row=rowOf(index);

    var target=
      rule.direction==="front"
        ? rule.number-1
        : rows-rule.number;

    if(rule.direction==="front"){

      if(row>target)return false;

    }else{

      if(row<target)return false;

    }

  }

  return true;

}


/* ================================
   位置指定
================================ */

function checkPositionRules(candidate,rules){

  for(var i=0;i<rules.position.length;i++){

    var rule=rules.position[i];

    if(!rule.name)continue;

    var index=findStudent(
      rule.name,
      candidate
    );

    if(index<0)return false;

    if(
      rowOf(index)!==rule.row-1 ||
      colOf(index)!==rule.col-1
    ){

      return false;

    }

  }

  return true;

}


/* ================================
   近づける条件
================================ */

function checkNearRules(candidate,rules){

  for(var i=0;i<rules.near.length;i++){

    var rule=rules.near[i];

    if(!rule.a || !rule.b)continue;

    var a=findStudent(
      rule.a,
      candidate
    );

    var b=findStudent(
      rule.b,
      candidate
    );

    if(a<0 || b<0)return false;

    if(
      seatDistance(a,b)>
      rule.distance
    ){

      return false;

    }

  }

  return true;

}


/* ================================
   離す条件
================================ */

function checkFarRules(candidate,rules){

  for(var i=0;i<rules.far.length;i++){

    var rule=rules.far[i];

    if(!rule.a || !rule.b)continue;

    var a=findStudent(
      rule.a,
      candidate
    );

    var b=findStudent(
      rule.b,
      candidate
    );

    if(a<0 || b<0)return false;

    if(
      seatDistance(a,b)<
      rule.distance
    ){

      return false;

    }

  }

  return true;

}


/* ================================
   班の配置
================================ */

function groupInfo(index){

  var gc=+$("groupCols").value;
  var gr=+$("groupRows").value;

  if(!gc && !gr){

    return {
      x:0,
      y:0
    };

  }

  return {

    x:gc
      ? Math.floor(colOf(index)/gc)
      : 0,

    y:gr
      ? Math.floor(rowOf(index)/gr)
      : 0

  };

}


/* ================================
   班長チェック
================================ */

function checkLeaders(candidate,rules){

  if(!rules.leader.length){
    return true;
  }

  var leaders=
    rules.leader.map(function(name){

      return findStudent(
        name,
        candidate
      );

    });


  for(var i=0;i<leaders.length;i++){

    if(leaders[i]<0){
      return false;
    }

  }


  /*
    班長同士が同じ班にならないようにする
  */

  for(var a=0;a<leaders.length;a++){

    for(var b=a+1;b<leaders.length;b++){

      var ga=groupInfo(leaders[a]);
      var gb=groupInfo(leaders[b]);

      if(
        ga.x===gb.x &&
        ga.y===gb.y
      ){

        return false;

      }

    }

  }

  return true;

}


/* ================================
   条件判定
================================ */

function isValidCandidate(candidate,rules){

  if(
    !checkColumnRules(
      candidate,
      rules
    )
  ){

    return false;

  }


  if(
    !checkPositionRules(
      candidate,
      rules
    )
  ){

    return false;

  }


  if(
    !checkNearRules(
      candidate,
      rules
    )
  ){

    return false;

  }


  if(
    !checkFarRules(
      candidate,
      rules
    )
  ){

    return false;

  }


  if(
    !checkLeaders(
      candidate,
      rules
    )
  ){

    return false;

  }


  return true;

}


/* ================================
   席替え結果を作る
================================ */

function generateSeats(){

  var rules=getRuleValues();

  var best=null;

  var attempts=0;

  /*
    条件を満たすまで何度か試す
  */

  while(
    attempts<5000
  ){

    var candidate=
      createCandidate();

    if(
      isValidCandidate(
        candidate,
        rules
      )
    ){

      best=candidate;

      break;

    }

    attempts++;

  }


  /*
    条件が厳しすぎる場合でも
    完全に停止しないようにする
  */

  if(!best){

    for(
      var retry=0;
      retry<100;
      retry++
    ){

      var candidate=
        createCandidate();

      if(
        isValidCandidate(
          candidate,
          rules
        )
      ){

        best=candidate;

        break;

      }

    }

  }


  if(!best){

    best=createCandidate();

    $("status").textContent=
      "条件をすべて満たす座席を作れなかったため、近い配置を作成しました。";

  }


  return best;

}

function createPresentationBoard(){

  }


  board.appendChild(table);

  return {
    board:board,
    seats:seats
  };

}


/* ================================
   発表順を作る
================================ */

function makeRevealOrder(axis){

  var order=[];


  if(axis==="row"){

    /*
      横一列ずつ
      左上 → 右
    */

    for(var r=0;r<rows;r++){

      for(var c=0;c<cols;c++){

        order.push(
          r*cols+c
        );

      }

    }

  }else{

    /*
      縦一列ずつ
      左上 → 下
    */

    for(var c=0;c<cols;c++){

      for(var r=0;r<rows;r++){

        order.push(
          r*cols+c
        );

      }

    }

  }


  return order;

}


/* ================================
   通常演出
================================ */

function runNormalPresentation(){

  var presentation=
    $("presentation");

  var stage=
    $("presentationStage");

  stage.innerHTML="";


  var data=
    createPresentationBoard();


  stage.appendChild(
    data.board
  );


  presentation.classList.add("show");


  var order=
    makeRevealOrder(
      $("animationAxis").value
    );


  var count=0;


  function revealNext(){

    if(count>=order.length){

      return;

    }


    var index=
      order[count];

    var seat=
      data.seats[index];

    var person=
      students[index];


    seat.classList.remove(
      "hidden-seat"
    );

    seat.classList.add(
      "revealed"
    );


    seat.textContent=
      person.name || "空席";


    if(person.gender==="男"){

      seat.classList.add("male");

    }

    if(person.gender==="女"){

      seat.classList.add("female");

    }


    count++;


    setTimeout(
      revealNext,
      600
    );

  }


  setTimeout(
    revealNext,
    600
  );

}


/* ================================
   スロット演出
================================ */

function runSlotPresentation(){

  var presentation=
    $("presentation");

  var stage=
    $("presentationStage");

  stage.innerHTML="";


  var data=
    createPresentationBoard();


  stage.appendChild(
    data.board
  );


  presentation.classList.add("show");


  var order=
    makeRevealOrder(
      $("animationAxis").value
    );


  var count=0;


  function slotOne(){

    if(count>=order.length){

      return;

    }


    var index=
      order[count];

    var seat=
      data.seats[index];


    var person=
      students[index];


    /*
      名前が高速で切り替わる
    */

    var pool=
      students
        .filter(function(s){
          return s.name;
        });


    var ticks=0;

    var interval=
      setInterval(function(){

        if(pool.length){

          var random=
            pool[
              Math.floor(
                Math.random()*
                pool.length
              )
            ];

          seat.textContent=
            random.name;

        }

        ticks++;

      },70);


    setTimeout(function(){

      clearInterval(interval);


      seat.classList.remove(
        "hidden-seat"
      );

      seat.classList.add(
        "revealed"
      );


      seat.textContent=
        person.name || "空席";


      if(person.gender==="男"){

        seat.classList.add("male");

      }

      if(person.gender==="女"){

        seat.classList.add("female");

      }


      count++;


      setTimeout(
        slotOne,
        600
      );


    },700);

  }


  setTimeout(
    slotOne,
    600
  );

}

/* ================================
   現在の列数に合わせて
   列指定セレクトを調整
================================ */

function updateRuleSelects(){

  document
    .querySelectorAll(
      "#columnRules .rule"
    )
    .forEach(function(rule){

      var select=
        rule.querySelectorAll("select")[2];

      if(!select)return;

      var current=
        parseInt(select.value,10) || 1;

      select.innerHTML="";

      for(
        var i=1;
        i<=rows;
        i++
      ){

        var option=
          document.createElement("option");

        option.value=i;

        option.textContent=
          i+"列目まで";

        if(i===current){

          option.selected=true;

        }

        select.appendChild(option);

      }

    });


  document
    .querySelectorAll(
      "#positionRules .rule"
    )
    .forEach(function(rule){

      var selects=
        rule.querySelectorAll("select");

      if(selects.length<3)return;


      var rowSelect=selects[1];

      var colSelect=selects[2];


      var currentRow=
        parseInt(rowSelect.value,10) || 1;

      var currentCol=
        parseInt(colSelect.value,10) || 1;


      rowSelect.innerHTML="";

      for(
        var r=1;
        r<=rows;
        r++
      ){

        var ro=
          document.createElement("option");

        ro.value=r;

        ro.textContent=
          "前から"+r+"列目";

        if(r===currentRow){

          ro.selected=true;

        }

        rowSelect.appendChild(ro);

      }


      colSelect.innerHTML="";

      for(
        var c=1;
        c<=cols;
        c++
      ){

        var co=
          document.createElement("option");

        co.value=c;

        co.textContent=
          "左から"+c+"列目";

        if(c===currentCol){

          co.selected=true;

        }

        colSelect.appendChild(co);

      }

    });

}

/* ================================
   班の間隔を視覚的に反映
================================ */

function applyGroupGaps(){

  var grid=
    $("seatGrid");

  if(!grid)return;

  var gc=
    parseInt(
      $("groupCols").value,
      10
    ) || 0;

  var gr=
    parseInt(
      $("groupRows").value,
      10
    ) || 0;


  var seats=
    grid.querySelectorAll(".seat");


  seats.forEach(function(seat,index){

    var r=rowOf(index);
    var c=colOf(index);


    seat.classList.remove(
      "gap-r",
      "gap-b"
    );


    /*
      横方向の班分け
      → 班と班の間に横の隙間
    */

    if(
      gc>0 &&
      (c+1)%gc===0 &&
      c<cols-1
    ){

      seat.classList.add(
        "gap-r"
      );

    }


    /*
      縦方向の班分け
      → 班と班の間に縦の隙間
    */

    if(
      gr>0 &&
      (r+1)%gr===0 &&
      r<rows-1
    ){

      seat.classList.add(
        "gap-b"
      );

    }

  });

}

/* ================================
   名前が入力されている生徒だけ
   列男女設定を適用
================================ */

function applyStoredColumnGender(){

  for(
    var c=0;
    c<cols;
    c++
  ){

    var gender=
      columnGenders[c];

    if(
      gender!=="男" &&
      gender!=="女"
    ){

      continue;

    }


    for(
      var r=0;
      r<rows;
      r++
    ){

      var index=
        r*cols+c;


      /*
        空席には性別を付けない
      */

      if(
        students[index] &&
        students[index].name
      ){

        students[index].gender=
          gender;

      }

    }

  }

}

$("saveBtn").onclick=function(){

  ){

    $("status").textContent=
      "画像保存機能の読み込みに失敗しました。";

    return;

  }


  var wrapper=
    document.createElement("div");

  wrapper.style.position=
    "fixed";

  wrapper.style.left=
    "-100000px";

  wrapper.style.top=
    "0";

  wrapper.style.background=
    "#fff";

  wrapper.style.padding=
    "30px";

  wrapper.style.width=
    Math.max(
      700,
      cols*120+80
    )+"px";


  var title=
    document.createElement("div");

  title.textContent=
    "席替え";

  title.style.textAlign=
    "center";

  title.style.fontSize=
    "28px";

  title.style.fontWeight=
    "800";

  title.style.marginBottom=
    "20px";


  var front=
    document.createElement("div");

  front.textContent=
    "黒板（前）";

  front.style.background=
    "#eee";

  front.style.padding=
    "10px";

  front.style.textAlign=
    "center";

  front.style.marginBottom=
    "20px";


  var grid=
    document.createElement("div");

  grid.style.display=
    "grid";

  grid.style.gridTemplateColumns=
    "repeat("+cols+",100px)";

  grid.style.gap=
    "8px";

  grid.style.justifyContent=
    "center";


  students.forEach(function(person,index){

    var cell=
      document.createElement("div");

    cell.style.width=
      "100px";

    cell.style.minHeight=
      "65px";

    cell.style.border=
      "2px solid #333";

    cell.style.borderRadius=
      "9px";

    cell.style.display=
      "flex";

    cell.style.alignItems=
      "center";

    cell.style.justifyContent=
      "center";

    cell.style.textAlign=
      "center";

    cell.style.padding=
      "7px";

    cell.style.fontWeight=
      "800";

    cell.style.overflowWrap=
      "anywhere";


    cell.textContent=
      person.name || "空席";


    if(person.gender==="男"){

      cell.style.color=
        "#4a90e2";

    }

    if(person.gender==="女"){

      cell.style.color=
        "#e85b67";

    }


    grid.appendChild(cell);

  });


  wrapper.append(
    title,
    front,
    grid
  );


  document.body.appendChild(
    wrapper
  );


  html2canvas(wrapper,{
    backgroundColor:"#ffffff",
    scale:2
  }).then(function(canvas){

    var link=
      document.createElement("a");

    link.download=
      "席替え.png";

    link.href=
      canvas.toDataURL(
        "image/png"
      );

    link.click();


    document.body.removeChild(
      wrapper
    );


    $("status").textContent=
      "画像を保存しました。";


  }).catch(function(){

    if(wrapper.parentNode){

      wrapper.parentNode.removeChild(
        wrapper
      );

    }


    $("status").textContent=
      "画像の保存に失敗しました。";

  });

};


/* ================================

function createPrintArea(
  blackboardBottom
){

  var area=
    $("printArea");

  area.innerHTML="";


  var title=
    document.createElement("div");

  title.className=
    "print-page-title";

  title.textContent=
    "席替え";


  var board=
    document.createElement("div");

  board.className=
    "print-board";


  var blackboard=
    document.createElement("div");

  blackboard.className=
    "print-blackboard";


  blackboard.textContent=
    "黒板";


  var grid=
    document.createElement("div");

  grid.className=
    "print-grid";

  grid.style.gridTemplateColumns=
    "repeat("+cols+",80px)";


  students.forEach(function(person){

    var seat=
      document.createElement("div");

    seat.className=
      "print-seat";


    seat.textContent=
      person.name || "空席";


    if(person.gender==="男"){

      seat.classList.add(
        "male"
      );

    }


    if(person.gender==="女"){

      seat.classList.add(
        "female"
      );

    }


    grid.appendChild(
      seat
    );

  });


  board.appendChild(
    blackboardBottom
      ? grid
      : blackboard
  );


  if(blackboardBottom){

    board.appendChild(
      blackboard
    );

  }else{

    board.appendChild(
      grid
    );

  }


  area.append(
    title,
    board
  );

}
