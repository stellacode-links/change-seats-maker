<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>席替えメーカー</title>

<style>
:root{
  --yellow:#F5E342;
  --dark:#333;
  --line:#ddd;
  --blue:#4A90E2;
  --red:#E85B67;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;
  color:var(--dark);
  background:#fafafa;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  background:var(--yellow);
  padding:23px 16px;
  text-align:center;
  box-shadow:0 2px 8px #0002;
}

.header h1{
  margin:0;
  font-size:30px;
  font-weight:800;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 3px 15px #0000000a;
}

.title{
  font-size:21px;
  font-weight:800;
  margin:0 0 16px;
}

.front{
  width:min(650px,90%);
  margin:0 auto 16px;
  background:#eee;
  border-radius:7px;
  text-align:center;
  padding:7px;
  color:#666;
  font-size:13px;
}

.seat-wrap{
  overflow:auto;
  padding:5px;
}

.seat-grid{
  display:grid;
  justify-content:center;
  align-items:start;
  justify-items:start;
  width:max-content;
  margin:auto;
}

.seat{
  width:92px;
  min-height:64px;
  border:2px solid #d6d6d6;
  background:#fff;
  border-radius:10px;
  color:#333;
  font-weight:700;
  padding:6px;
  overflow-wrap:anywhere;
  transition:.12s;
}

.seat:hover{
  border-color:#c9b800;
}

.seat.empty{
  color:#999;
  font-weight:500;
}

.seat-gap{
  margin:0;
}

.setting-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.field label{
  font-size:13px;
  font-weight:700;
  display:block;
}

select,
input[type=number],
input[type=text],
textarea{
  width:100%;
  margin-top:6px;
  padding:10px;
  border:1px solid #ccc;
  border-radius:9px;
  background:white;
  outline:none;
}

select:focus,
input:focus,
textarea:focus{
  border-color:#c9b800;
  box-shadow:0 0 0 3px #f5e34255;
}

.sub{
  font-size:16px;
  font-weight:800;
  margin:25px 0 10px;
}

.rule-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.rule{
  display:grid;
  gap:7px;
  align-items:end;
}

.rule.column{
  grid-template-columns:minmax(130px,1fr) 120px 120px 44px;
}

.rule.position{
  grid-template-columns:minmax(130px,1fr) 145px 145px 44px;
}

.rule.distance{
  grid-template-columns:minmax(130px,1fr) minmax(130px,1fr) 90px 80px 44px;
}

.rule.leader{
  grid-template-columns:minmax(130px,1fr) 44px;
}

.remove{
  height:42px;
  border:0;
  border-radius:9px;
  background:#eee;
  font-weight:800;
}

.remove:hover{
  background:#ddd;
}

.add{
  margin-top:9px;
  border:0;
  background:#eee;
  border-radius:9px;
  padding:10px 14px;
  font-weight:700;
}

.add:hover{
  background:#ddd;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:18px;
}

.main-btn,
.sub-btn{
  border:0;
  border-radius:11px;
  padding:13px 22px;
  font-weight:800;
}

.main-btn{
  background:var(--yellow);
}

.main-btn:hover{
  background:#d9c900;
}

.sub-btn{
  background:#eee;
}

.sub-btn:hover{
  background:#ddd;
}

.check{
  display:flex;
  gap:9px;
  align-items:center;
  margin-top:12px;
  font-weight:600;
  font-size:14px;
}

.check input{
  width:19px;
  height:19px;
  margin:0;
  accent-color:#d3c300;
}

.status{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-top:10px;
  min-height:20px;
}

.student-input-note{
  font-size:13px;
  color:#777;
  margin:0 0 10px;
}

.bulk-area{
  margin-top:12px;
}

.bulk-area textarea{
  min-height:140px;
  resize:vertical;
}

.hidden{
  display:none!important;
}

.gender-columns{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:8px;
  margin-top:8px;
}

.gender-column{
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px;
  background:#fafafa;
}

.gender-column-title{
  font-size:13px;
  font-weight:800;
  margin-bottom:5px;
}

.gender-choice-buttons{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  border:1px solid #ccc;
  border-radius:999px;
  overflow:hidden;
  background:#eee;
}

.gender-choice{
  border:0;
  border-radius:0;
  background:#eee;
  padding:9px 4px;
  font-weight:800;
  min-height:42px;
}

.gender-choice.selected{color:#fff;}
.gender-choice.none.selected{background:#777;}
.gender-choice.male.selected{background:var(--blue);}
.gender-choice.female.selected{background:#ff4d68;}

.presentation{
  display:none;
  position:fixed;
  inset:0;
  background:#fff;
  z-index:10000;
  overflow:auto;
}

.presentation.show{
  display:block;
}

.presentation-head{
  height:72px;
  background:var(--yellow);
  display:flex;
  align-items:center;
  justify-content:center;
  position:sticky;
  top:0;
  z-index:2;
}

.presentation-head h2{
  margin:0;
  font-size:24px;
}

.presentation-close{
  position:absolute;
  right:18px;
  top:15px;
  border:0;
  background:#fff;
  border-radius:10px;
  padding:10px 16px;
  font-weight:800;
}

.presentation-stage{
  min-height:calc(100vh - 72px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:35px;
}

.presentation-table{
  display:grid;
  gap:8px;
  justify-content:center;
  align-items:start;
  justify-items:start;
}

.presentation-table .seat{
  width:100px;
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:18px;
  line-height:1.2;
  font-weight:900;
  padding:7px;
}

.presentation-table .seat.presentation-hidden{
  background:#111;
  border-color:#111;
  color:#111!important;
}

.presentation-table .seat.presentation-revealed{
  animation:seatReveal .28s ease;
}

@keyframes seatReveal{
  from{transform:scale(.88);opacity:.5;}
  to{transform:scale(1);opacity:1;}
}

#printArea{
  display:none;
}

.print-page-title{
  text-align:center;
  font-size:28px;
  font-weight:800;
  margin-bottom:20px;
}

.print-board{
  border:2px solid #333;
  padding:20px;
  display:inline-block;
  min-width:80%;
  margin-left:10%;
  margin-right:10%;
}

.print-blackboard{
  text-align:center;
  border:2px solid #333;
  padding:8px;
  margin-bottom:20px;
  font-weight:800;
}

.print-blackboard.bottom{
  margin-top:20px;
  margin-bottom:0;
}

.print-grid{
  display:grid;
  justify-content:center;
  gap:8px;
}

.print-seat{
  border:2px solid #333;
  border-radius:7px;
  min-width:80px;
  min-height:55px;
  padding:8px;
  text-align:center;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
}

.print-seat.male{
  color:var(--blue);
}

.print-seat.female{
  color:var(--red);
}

#exportCanvas{
  display:none;
}

@media(max-width:750px){

  .container{
    padding:12px 9px;
  }

  .card{
    padding:15px;
  }

  .setting-grid{
    grid-template-columns:1fr;
  }

  .rule.column,
  .rule.position,
  .rule.distance,
  .rule.leader{
    grid-template-columns:1fr 1fr;
  }

  .remove{
    width:100%;
  }

  .seat{
    width:72px;
    min-height:56px;
    font-size:12px;
  }

  .presentation-table .seat{
    width:70px;
    min-height:58px;
    font-size:15px;
  }
}

@media print{

  body{
    background:white;
  }

  body>*:not(#printArea){
    display:none!important;
  }

  #printArea{
    display:block!important;
    padding:25px;
  }
}
</style>
</head>

<body>

<header class="header">
  <h1>席替えメーカー</h1>
</header>

<main class="container">

<section class="card">

  <h2 class="title">座席表</h2>

  <div class="front">
    黒板（前）
  </div>

  <div class="seat-wrap">
    <div id="seatGrid" class="seat-grid"></div>
  </div>

</section>

<section class="card">

  <h2 class="title">生徒入力</h2>

  <p class="student-input-note">
    座席をタップすると、その席の名前と男女を入力できます。
  </p>

  <div class="actions">

    <button
      id="bulkToggle"
      type="button"
      class="sub-btn">
      一括入力
    </button>

    <button
      id="clearBtn"
      type="button"
      class="sub-btn">
      座席表をクリア
    </button>

  </div>

  <div
    id="bulkArea"
    class="bulk-area hidden">

    <textarea
      id="bulkInput"
      placeholder="田中　佐藤　空席　山田
高橋　橋本　鈴木　空席"></textarea>

    <div class="actions">

      <button
        id="applyBulk"
        type="button"
        class="main-btn">
        一括入力を反映
      </button>

    </div>

  </div>

  <h3 class="sub">
    列ごとの男女指定
  </h3>

  <div
    id="genderColumns"
    class="gender-columns">
  </div>

    </section>
    <section class="card">

  <h2 class="title">
    設定
  </h2>

  <h3 class="sub">
    座席数の指定
  </h3>

  <div class="setting-grid">

    <div class="field">

      <label>
        全体：横
        <select id="cols"></select>
      </label>

    </div>

    <div class="field">

      <label>
        縦
        <select id="rows"></select>
      </label>

    </div>

  </div>

  <h3 class="sub">
    班
  </h3>

  <div class="setting-grid">

    <div class="field">

      <label>
        横
        <select id="groupCols">

          <option value="0">
            なし
          </option>

          <option value="2">
            2
          </option>

          <option value="3">
            3
          </option>

          <option value="4">
            4
          </option>

          <option value="5">
            5
          </option>

          <option value="6">
            6
          </option>

        </select>
      </label>

    </div>

    <div class="field">

      <label>
        縦
        <select id="groupRows">

          <option value="0">
            なし
          </option>

          <option value="2">
            2
          </option>

          <option value="3">
            3
          </option>

          <option value="4">
            4
          </option>

          <option value="5">
            5
          </option>

          <option value="6">
            6
          </option>

        </select>
      </label>

    </div>

  </div>

  <h3 class="sub">
    列の指定
  </h3>

  <div
    id="columnRules"
    class="rule-list">
  </div>

  <button
    id="addColumn"
    type="button"
    class="add">
    + 条件を指定
  </button>

  <h3 class="sub">
    生徒の位置を指定
  </h3>

  <div
    id="positionRules"
    class="rule-list">
  </div>

  <button
    id="addPosition"
    type="button"
    class="add">
    + 条件を指定
  </button>

  <h3 class="sub">
    生徒同士を近づける
  </h3>

  <div
    id="nearRules"
    class="rule-list">
  </div>

  <button
    id="addNear"
    type="button"
    class="add">
    + 条件を追加
  </button>

  <h3 class="sub">
    生徒同士を離す
  </h3>

  <div
    id="farRules"
    class="rule-list">
  </div>

  <button
    id="addFar"
    type="button"
    class="add">
    + 条件を追加
  </button>

  <h3 class="sub">
    班長を指定する
  </h3>

  <div
    id="leaderRules"
    class="rule-list">
  </div>

  <button
    id="addLeader"
    type="button"
    class="add">
    + 班長を追加
  </button>

  <label
    id="leaderSeparateWrap"
    class="check hidden">

    <input
      type="checkbox"
      id="leaderSeparate">

    班長同士を同じ班にしない

  </label>

</section>

<section class="card">

  <div class="setting-grid">

    <div class="field">

      <select id="animationType">

        <option value="normal">
          ノーマル
        </option>

        <option value="slot">
          スロット
        </option>

      </select>

    </div>

    <div class="field">

      <select id="animationDirection">

        <option value="row">
          横
        </option>

        <option value="col">
          縦
        </option>

      </select>

    </div>

  </div>

  <label class="check">

    <input
      type="checkbox"
      id="moveAll">

    全員が席を移動する

  </label>

  <label class="check">

    <input
      type="checkbox"
      id="fixGender">

    男女を固定する

  </label>

  <label class="check">

    <input
      type="checkbox"
      id="fixEmpty">

    空席の位置を固定する

  </label>

  <div class="actions">

    <button
      id="shuffleBtn"
      type="button"
      class="main-btn">

      席替えする！

    </button>

    <button
      id="resetBtn"
      type="button"
      class="sub-btn">

      座席をリセット

    </button>

  </div>

  <div
    id="status"
    class="status">
  </div>

</section>

<section class="card">

  <h2 class="title">
    保存・印刷
  </h2>

  <p style="font-size:13px">
    席替え後の座席表を画像として保存したり、印刷できます。
  </p>

  <div class="actions">

    <button
      id="saveBtn"
      type="button"
      class="main-btn">
      画像として保存
    </button>

    <button
      id="printTopBtn"
      type="button"
      class="sub-btn">
      印刷（黒板が上）
    </button>

    <button
      id="printBottomBtn"
      type="button"
      class="sub-btn">
      印刷（黒板が下）
    </button>

  </div>

</section>

</main>

<div
  id="presentation"
  class="presentation">

  <div class="presentation-head">

    <h2>
      席替え発表
    </h2>

    <button
      id="closePresentation"
      type="button"
      class="presentation-close">

      閉じる

    </button>

  </div>

  <div
    id="presentationStage"
    class="presentation-stage">
  </div>

</div>

<div id="printArea"></div>

<canvas id="exportCanvas"></canvas>

<script>

(function(){

"use strict";

var rows=6;
var cols=6;

var students=[];

/* 列ごとの男女指定 */
var columnGenderSettings=[];

var originalSeats=[];

var hasPreviousSeat=false;

for(var i=0;i<36;i++){

  students.push({
    name:"",
    gender:""
  });

}

function $(id){

  return document.getElementById(id);

}

function fillSelect(id,max,selected){

  var select=$(id);

  select.innerHTML="";

  for(var i=1;i<=max;i++){

    var option=document.createElement("option");

    option.value=i;

    option.textContent=i;

    if(i===selected){
      option.selected=true;
    }

    select.appendChild(option);

  }

}

fillSelect("cols",10,6);

fillSelect("rows",10,6);

function names(){

  var result=[];

  students.forEach(function(student){

    if(
      student.name &&
      result.indexOf(student.name)===-1
    ){

      result.push(student.name);

    }

  });

  return result;

}

function studentSelect(){

  var select=document.createElement("select");

  select.className="student-select";

  var first=document.createElement("option");

  first.value="";

  first.textContent="生徒を選択";

  select.appendChild(first);

  names().forEach(function(name){

    var option=document.createElement("option");

    option.value=name;

    option.textContent=name;

    select.appendChild(option);

  });

  return select;

}

function refreshSelects(){

  document
    .querySelectorAll(".student-select")
    .forEach(function(old){

      var value=old.value;

      var replacement=studentSelect();

      replacement.value=value;

      old.parentNode.replaceChild(
        replacement,
        old
      );

    });

  updateLeaderVisibility();

  refreshLeaderEvents();

}

function render(){

  var grid=$("seatGrid");

  grid.innerHTML="";

  var groupCols=
    +$("groupCols").value;

  var groupRows=
    +$("groupRows").value;

  var isMobile=window.innerWidth<=750;
  var baseSeatWidth=isMobile?72:92;
  var baseSeatHeight=isMobile?56:64;
  var normalGap=3;
  var groupGap=18;

  var columnTracks=[];
  for(var tc=0;tc<cols;tc++){
    var extraColumnGap=
      groupCols &&
      tc<cols-1 &&
      (tc+1)%groupCols===0
      ? groupGap
      : normalGap;
    columnTracks.push((baseSeatWidth+extraColumnGap)+"px");
  }

  var rowTracks=[];
  for(var tr=0;tr<rows;tr++){
    var extraRowGap=
      groupRows &&
      tr<rows-1 &&
      (tr+1)%groupRows===0
      ? groupGap
      : normalGap;
    rowTracks.push((baseSeatHeight+extraRowGap)+"px");
  }

  grid.style.gridTemplateColumns=columnTracks.join(" ");
  grid.style.gridTemplateRows=rowTracks.join(" ");

  for(var r=0;r<rows;r++){

    for(var c=0;c<cols;c++){

      var index=
        r*cols+c;

      var button=
        document.createElement("button");

      button.type="button";

      button.className="seat seat-gap";

      var person=
        students[index];

      button.textContent=
        person.name ||
        "空席";

      if(!person.name){

        button.classList.add("empty");

      }


      if(person.gender==="男"){

        button.style.color=
          "var(--blue)";

      }

      else if(person.gender==="女"){

        button.style.color=
          "var(--red)";

      }

      (function(index){

        button.onclick=function(){

          var current=
            students[index];

          var name=
            prompt(
              "名前を入力してください。\n空欄で空席になります。",
              current.name
            );

          if(name===null){

            return;

          }

          name=name.trim();

          if(
            !name ||
            name==="空席"
          ){

            students[index]={
              name:"",
              gender:""
            };

            render();

            refreshSelects();

            renderGenderColumns();

            return;

          }

          var gender=
            prompt(
              "性別を入力してください。\n「男」または「女」を入力（任意）",
              current.gender
            );

          if(gender===null){

            gender=
              current.gender;

          }

          gender=
            gender.trim();

          if(
            gender!=="男" &&
            gender!=="女"
          ){

            gender="";

          }

          students[index]={
            name:name,
            gender:gender
          };

          render();

          refreshSelects();

          renderGenderColumns();

        };

      })(index);

      grid.appendChild(button);

    }

  }

  renderGenderColumns();

}

function renderGenderColumns(){

  var area=$("genderColumns");
  area.innerHTML="";

  for(var c=0;c<cols;c++){
    var box=document.createElement("div");
    box.className="gender-column";

    var title=document.createElement("div");
    title.className="gender-column-title";
    title.textContent=(c+1)+"列目";

    var buttonWrap=document.createElement("div");
    buttonWrap.className="gender-choice-buttons";

    var currentGender=columnGenderSettings[c] || "";

    if(!currentGender){
      var genders=[];
      for(var r=0;r<rows;r++){
        var person=students[r*cols+c];
        if(person.name && person.gender){genders.push(person.gender);}
      }
      if(genders.length && genders.every(function(g){return g==="男";})){
        currentGender="男";
      }else if(genders.length && genders.every(function(g){return g==="女";})){
        currentGender="女";
      }
    }

    [
      {value:"",label:"指定なし",className:"none"},
      {value:"男",label:"男",className:"male"},
      {value:"女",label:"女",className:"female"}
    ].forEach(function(choice){
      var btn=document.createElement("button");
      btn.type="button";
      btn.className="gender-choice "+choice.className;
      btn.textContent=choice.label;
      if(currentGender===choice.value){btn.classList.add("selected");}

      (function(columnIndex, genderValue){
        btn.onclick=function(){
          var gender=genderValue;
          columnGenderSettings[columnIndex]=gender;
          for(var row=0;row<rows;row++){
            var index=row*cols+columnIndex;
            if(students[index].name){students[index].gender=gender;}
          }
          render();
          refreshSelects();
          renderGenderColumns();
          savePersistentState();
        };
      })(c, choice.value);
      buttonWrap.appendChild(btn);
    });

    box.appendChild(title);
    box.appendChild(buttonWrap);
    area.appendChild(box);
  }
}

  function shuffleArray(array){

  var copy=array.slice();

  for(
    var i=copy.length-1;
    i>0;
    i--
  ){

    var j=
      Math.floor(
        Math.random()*(i+1)
      );

    var temp=copy[i];

    copy[i]=copy[j];

    copy[j]=temp;

  }

  return copy;

}

function positionDistance(
  a,
  b
){

  var ar=Math.floor(a/cols);
  var ac=a%cols;

  var br=Math.floor(b/cols);
  var bc=b%cols;

  return Math.abs(ar-br)+
         Math.abs(ac-bc);

}


function getGroupNumber(index){

  var r=Math.floor(index/cols);
  var c=index%cols;

  var gc=
    +$("groupCols").value;

  var gr=
    +$("groupRows").value;

  var gx=
    gc?
    Math.floor(c/gc):
    0;

  var gy=
    gr?
    Math.floor(r/gr):
    0;

  if(!gc && !gr){

    return 0;

  }

  if(!gc){

    return gy;

  }

  if(!gr){

    return gx;

  }

  return gy+"-"+gx;

}


function makeCandidates(
  person,

  fixedEmpty
){

  var candidates=[];

  available.forEach(function(index){

    if(
      fixedEmpty &&
      !person.name
    ){

      return;

    }

    if(
      fixedGender &&
      person.gender &&
      fixedGender[index] &&
      person.gender!==fixedGender[index]
    ){

      return;

    }

    candidates.push(index);

  });

  return candidates;

}


function applyPositionRules(result, available){
  var rules=getPositionRules();
  var occupiedTargets={};

  rules.forEach(function(rule){
    var current=findStudentIndex(result,rule.name);
    if(current<0){return;}

    var target=rule.index;
    if(target<0 || target>=result.length){return;}
    if(occupiedTargets[target] && occupiedTargets[target]!==rule.name){return;}
    if(target===current){
      occupiedTargets[target]=rule.name;
      return;
    }

    /* 正確な位置指定は、指定席の人と入れ替えて確実に固定する */
    var temp=result[target];
    result[target]=result[current];
    result[current]=temp;
    occupiedTargets[target]=rule.name;
  });
}

function applyColumnRules(result){
  var rules=getColumnRules();
  var locked={};

  rules.forEach(function(rule){
    var current=findStudentIndex(result,rule.name);
    if(current<0){return;}

    var limit=Math.max(1,Math.min(rows,rule.limit));
    var allowedRows=[];
    for(var r=0;r<limit;r++){
      allowedRows.push(rule.direction==="front" ? r : rows-1-r);
    }

    var currentRow=Math.floor(current/cols);
    if(allowedRows.indexOf(currentRow)>=0){
      locked[rule.name]=true;
      return;
    }

    /* 同じ列に限定せず、指定された範囲内の空席/非固定席を探す */
    var candidates=[];
    for(var i=0;i<result.length;i++){
      var row=Math.floor(i/cols);
      if(allowedRows.indexOf(row)<0){continue;}
      if(locked[result[i].name]){continue;}
      candidates.push(i);
    }

    if(!candidates.length){return;}

    candidates.sort(function(a,b){
      var da=Math.abs(Math.floor(a/cols)-currentRow);
      var db=Math.abs(Math.floor(b/cols)-currentRow);
      return da-db;
    });

    var target=candidates[0];
    var temp=result[target];
    result[target]=result[current];
    result[current]=temp;
    locked[rule.name]=true;
  });
}

function respectGender(
  result,
  originalGender,
  fixed
){

  if(!fixed){

    return result;

  }

  for(
    var i=0;
    i<result.length;
    i++
  ){

    var person=
      result[i];

    if(
      !person.name ||
      !person.gender
    ){

      continue;

    }

    if(
      originalGender[i] &&
      person.gender===
      originalGender[i]
    ){

      continue;

    }

    var swap=-1;

    for(
      var j=i+1;
      j<result.length;
      j++
    ){

      if(
        result[j].gender===
        originalGender[i]
      ){

        swap=j;
        break;

      }

    }

    if(swap>=0){

      var temp=
        result[i];

      result[i]=
        result[swap];

      result[swap]=
        temp;

    }

  }

  return result;

}


function respectEmpty(
  result,
  emptyPositions
){

  var current=[];

  result.forEach(function(person,index){

    if(!person.name){

      current.push(index);

    }

  });


  emptyPositions.forEach(function(target,k){

    if(
      !current.length
    ){

      return;

    }

    var source=
      current[k%current.length];

    if(source===target){

      return;

    }

    var temp=
      result[target];

    result[target]=
      result[source];

    result[source]=
      temp;

  });

  return result;

}


function enforceLeaders(result){

  var leaders=getLeaderNames();
  if(leaders.length<2 || !$("leaderSeparate").checked){
    return result;
  }

  var gc=+$('groupCols').value;
  var gr=+$('groupRows').value;
  if(!gc && !gr){return result;}

  /* 班長同士が同じ班なら、班長ではない生徒と入れ替えて別の班へ移す。 */
  for(var i=0;i<leaders.length;i++){
    for(var j=i+1;j<leaders.length;j++){
      var a=findStudentIndex(result,leaders[i]);
      var b=findStudentIndex(result,leaders[j]);
      if(a<0 || b<0 || getGroupNumber(a)!==getGroupNumber(b)){
        continue;
      }

      var sourceLeader=b;
      var target=-1;

      for(var x=0;x<result.length;x++){
        if(x===a || x===b){continue;}
        if(getGroupNumber(x)===getGroupNumber(a)){continue;}
        if(!result[x].name){continue;}
        if(leaders.indexOf(result[x].name)>=0){continue;}
        target=x;
        break;
      }

      if(target<0){
        for(var y=0;y<result.length;y++){
          if(y===a || y===b){continue;}
          if(getGroupNumber(y)===getGroupNumber(a)){continue;}
          target=y;
          break;
        }
      }

      if(target>=0){
        var temp=result[sourceLeader];
        result[sourceLeader]=result[target];
        result[target]=temp;
      }
    }
  }

  return result;
}

function applyDistanceRules(result){
  var nearRules=$("nearRules").querySelectorAll(".distance");
  var farRules=$("farRules").querySelectorAll(".distance");

  nearRules.forEach(function(rule){
    var selects=rule.querySelectorAll("select");
    if(selects.length<2){return;}
    var a=findStudentIndex(result,selects[0].value);
    var b=findStudentIndex(result,selects[1].value);
    if(a<0 || b<0 || a===b){return;}
    var limit=+rule.querySelector("input[type=number]").value || 1;
    if(positionDistance(a,b)<=limit){return;}
    var best=-1,bestDistance=Infinity;
    for(var i=0;i<result.length;i++){
      if(i===a || i===b){continue;}
      var d=positionDistance(i,b);
      if(d<bestDistance){bestDistance=d;best=i;}
    }
    if(best>=0){var temp=result[a];result[a]=result[best];result[best]=temp;}
  });

  farRules.forEach(function(rule){
    var selects=rule.querySelectorAll("select");
    if(selects.length<2){return;}
    var a=findStudentIndex(result,selects[0].value);
    var b=findStudentIndex(result,selects[1].value);
    if(a<0 || b<0 || a===b){return;}
    var limit=+rule.querySelector("input[type=number]").value || 1;
    if(positionDistance(a,b)>=limit){return;}
    var best=-1,bestDistance=-1;
    for(var i=0;i<result.length;i++){
      if(i===a || i===b){continue;}
      var d=positionDistance(i,b);
      if(d>bestDistance){bestDistance=d;best=i;}
    }
    if(best>=0){var temp=result[a];result[a]=result[best];result[best]=temp;}
  });
  return result;
}

function generateSeats(){

  var original=cloneStudents(students);
  originalSeats=cloneStudents(students);
  hasPreviousSeat=true;

  var positionRules=getPositionRules();
  var columnRules=getColumnRules();
  var leaders=getLeaderNames();
  var leaderSeparate=$('leaderSeparate').checked && leaders.length>=2;
  var fixedGender=getFixedGender();
  var emptyPositions=getEmptyPositions();

  /*
   * まず、正確な位置指定だけは絶対に固定する。
   * それ以外の条件は、固定席を避けながら全体の組み合わせを評価して決める。
   */
  var locked={};
  positionRules.forEach(function(rule){
    if(rule.index>=0 && rule.index<students.length && findStudentIndex(students,rule.name)>=0){
      locked[rule.index]=rule.name;
    }
  });

  function canSwap(a,b,result){
    if(a===b){return false;}
    if(locked[a] || locked[b]){return false;}

    if($('fixEmpty').checked && (!!result[a].name)!== (!!result[b].name)){
      return false;
    }

    if($('fixGender').checked){
      var ga=result[a].gender||'';
      var gb=result[b].gender||'';
      if(ga!==gb){return false;}
    }

    return true;
  }

  function applyExactPositions(result){
    positionRules.forEach(function(rule){
      var current=findStudentIndex(result,rule.name);
      var target=rule.index;
      if(current<0 || target<0 || target>=result.length){return;}
      if(current===target){return;}
      if(locked[target] && locked[target]!==rule.name){return;}
      var temp=result[target];
      result[target]=result[current];
      result[current]=temp;
    });
  }

  function rulePenalty(result){
    var penalty=0;

    /* 正確な位置 */
    positionRules.forEach(function(rule){
      var idx=findStudentIndex(result,rule.name);
      if(idx!==rule.index){penalty+=100000;}
    });

    /* 列指定（前から／後ろから○列目まで） */
    columnRules.forEach(function(rule){
      var idx=findStudentIndex(result,rule.name);
      if(idx<0){return;}
      var row=Math.floor(idx/cols);
      var limit=Math.max(1,Math.min(rows,rule.limit));
      var ok=rule.direction==='front' ? row<limit : row>=rows-limit;
      if(!ok){
        var distance=rule.direction==='front' ? row-limit+1 : (rows-limit-1)-row;
        penalty+=30000+Math.max(0,distance)*5000;
      }
    });

    /* 生徒同士を近づける */
    $('nearRules').querySelectorAll('.distance').forEach(function(rule){
      var selects=rule.querySelectorAll('select');
      if(selects.length<2){return;}
      var a=findStudentIndex(result,selects[0].value);
      var b=findStudentIndex(result,selects[1].value);
      if(a<0 || b<0 || a===b){return;}
      var limit=+rule.querySelector('input[type=number]').value||1;
      var d=positionDistance(a,b);
      if(d>limit){penalty+=(d-limit)*5000+20000;}
    });

    /* 生徒同士を離す */
    $('farRules').querySelectorAll('.distance').forEach(function(rule){
      var selects=rule.querySelectorAll('select');
      if(selects.length<2){return;}
      var a=findStudentIndex(result,selects[0].value);
      var b=findStudentIndex(result,selects[1].value);
      if(a<0 || b<0 || a===b){return;}
      var limit=+rule.querySelector('input[type=number]').value||1;
      var d=positionDistance(a,b);
      if(d<limit){penalty+=(limit-d)*5000+20000;}
    });

    /* 班長同士を別の班へ */
    if(leaderSeparate){
      for(var i=0;i<leaders.length;i++){
        var a=findStudentIndex(result,leaders[i]);
        if(a<0){continue;}
        for(var j=i+1;j<leaders.length;j++){
          var b=findStudentIndex(result,leaders[j]);
          if(b>=0 && getGroupNumber(a)===getGroupNumber(b)){penalty+=25000;}
        }
      }
    }

    /* 男女固定・空席固定は候補生成でも守るが、念のため評価にも含める */
    if($('fixGender').checked){
      for(var g=0;g<result.length;g++){
        if(result[g].name && fixedGender[g] && result[g].gender!==fixedGender[g]){penalty+=100000;}
      }
    }
    if($('fixEmpty').checked){
      for(var e=0;e<result.length;e++){
        if(!!result[e].name !== !!students[e].name){penalty+=100000;}
      }
    }

    /* 全員が席を移動する */
    if($('moveAll').checked){
      for(var m=0;m<result.length;m++){
        if(result[m].name && result[m].name===original[m].name){penalty+=100;}
      }
    }

    return penalty;
  }

  function makeInitial(){
    var result=shuffleArray(cloneStudents(students));
    applyExactPositions(result);

    /* 正確な位置指定を何度入れ替えても壊さないよう、位置指定を最後に再適用 */
    applyExactPositions(result);
    return result;
  }

  var best=null;
  var bestScore=Infinity;

  /* 条件を同時に満たす組み合わせを探索する */
  for(var restart=0;restart<8;restart++){
    var result=makeInitial();
    var score=rulePenalty(result);

    if(score<bestScore){
      bestScore=score;
      best=cloneStudents(result);
    }
    if(score===0){break;}

    var movable=[];
    for(var q=0;q<result.length;q++){
      if(!locked[q]){movable.push(q);}
    }

    for(var iter=0;iter<25000;iter++){
      if(movable.length<2){break;}

      var ai=movable[Math.floor(Math.random()*movable.length)];
      var bi=movable[Math.floor(Math.random()*movable.length)];
      if(!canSwap(ai,bi,result)){continue;}

      var temp=result[ai];
      result[ai]=result[bi];
      result[bi]=temp;

      var nextScore=rulePenalty(result);

      /* 良化は必ず採用。悪化は序盤だけ少し許して局所解を避ける。 */
      var temperature=Math.max(0.03,1-(iter/25000));
      if(nextScore<=score || Math.random()<Math.exp((score-nextScore)/(5000*temperature))){
        score=nextScore;
      }else{
        temp=result[ai];
        result[ai]=result[bi];
        result[bi]=temp;
      }

      if(score<bestScore){
        bestScore=score;
        best=cloneStudents(result);
      }

      if(bestScore===0){break;}
    }

    if(bestScore===0){break;}
  }

  students=best || makeInitial();

  /* 正確な位置指定は最終結果でも必ず保証 */
  positionRules.forEach(function(rule){
    var current=findStudentIndex(students,rule.name);
    if(current>=0 && rule.index>=0 && rule.index<students.length && current!==rule.index){
      var temp=students[rule.index];
      students[rule.index]=students[current];
      students[current]=temp;
    }
  });

  return students;

}

function saveAsImage(){

  var grid=
    $("seatGrid");

  if(!grid){

    return;

  }

  var canvas=
    $("exportCanvas");

  var scale=2;

  var seatWidth=92;
  var seatHeight=64;

  var gap=3;

  var groupCols=
    +$("groupCols").value;

  var groupRows=
    +$("groupRows").value;

  var extraX=
    groupCols
    ? Math.ceil(cols/groupCols)*15
    : 0;

  var extraY=
    groupRows
    ? Math.ceil(rows/groupRows)*15
    : 0;

  canvas.width=
    cols*seatWidth*scale+
    (cols-1)*gap*scale+
    extraX*scale;

  canvas.height=
    rows*seatHeight*scale+
    (rows-1)*gap*scale+
    extraY*scale;

  var ctx=
    canvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle="#ffffff";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  for(
    var r=0;
    r<rows;
    r++
  ){

    for(
      var c=0;
      c<cols;
      c++
    ){

      var index=
        r*cols+c;

      var x=
        c*seatWidth*scale+
        c*gap*scale;

      var y=
        r*seatHeight*scale+
        r*gap*scale;

      if(
        groupCols &&
        c>0 &&
        c%groupCols===0
      ){

        x+=
          Math.floor(
            c/groupCols
          )*15*scale;

      }

      if(
        groupRows &&
        r>0 &&
        r%groupRows===0
      ){

        y+=
          Math.floor(
            r/groupRows
          )*15*scale;

      }

      ctx.strokeStyle=
        "#d6d6d6";

      ctx.lineWidth=
        2*scale;

      roundRect(
        ctx,
        x,
        y,
        seatWidth*scale,
        seatHeight*scale,
        10*scale
      );

      ctx.stroke();

      var person=
        students[index];

      ctx.font=
        "bold 15px sans-serif";

      if(
        person.gender==="男"
      ){

        ctx.fillStyle=
          "#4A90E2";

      }

      else if(
        person.gender==="女"
      ){

        ctx.fillStyle=
          "#E85B67";

      }

      else{

        ctx.fillStyle=
          "#333333";

      }

      ctx.fillText(
        person.name ||
        "空席",
        x+
          seatWidth*scale/2,
        y+
          seatHeight*scale/2,
        seatWidth*scale-12*scale
      );

    }

  }

  var link=
    document.createElement("a");

  link.download=
    "座席表.png";

  link.href=
    canvas.toDataURL(
      "image/png"
    );

  link.click();

}


function roundRect(
  ctx,
  x,
  y,
  width,
  height,
  radius
){

  var r=
    Math.min(
      radius,
      width/2,
      height/2
    );

  ctx.beginPath();

  ctx.moveTo(
    x+r,
    y
  );

  ctx.arcTo(
    x+width,
    y,
    x+width,
    y+height,
    r
  );

  ctx.arcTo(
    x+width,
    y+height,
    x,
    y+height,
    r
  );

  ctx.arcTo(
    x,
    y+height,
    x,
    y,
    r
  );

  ctx.arcTo(
    x,
    y,
    x+width,
    y,
    r
  );

  ctx.closePath();

}


function createPrintArea(
  bottom
){

  var area=
    $("printArea");

  area.innerHTML="";

  var title=
    document.createElement("div");

  title.className=
    "print-page-title";

  title.textContent=
    "座席表";

  area.appendChild(title);

  var board=
    document.createElement("div");

  board.className=
    "print-board";

  var blackboard=
    document.createElement("div");

  blackboard.className=
    "print-blackboard";

  blackboard.textContent=
    "黒板";

  if(!bottom){

    board.appendChild(
      blackboard
    );

  }

  var grid=
    document.createElement("div");

  grid.className=
    "print-grid";

  grid.style.gridTemplateColumns=
    "repeat("+cols+",80px)";

  var groupCols=
    +$("groupCols").value;

  var groupRows=
    +$("groupRows").value;

  for(
    var r=0;
    r<rows;
    r++
  ){

    for(
      var c=0;
      c<cols;
      c++
    ){

      var index=
        r*cols+c;

      var seat=
        document.createElement("div");

      seat.className=
        "print-seat";

      var person=
        students[index];

      if(
        person.gender==="男"
      ){

        seat.classList.add(
          "male"
        );

      }

      if(
        person.gender==="女"
      ){

        seat.classList.add(
          "female"
        );

      }

      seat.textContent=
        person.name ||
        "空席";

      if(
        groupCols &&
        c<cols-1 &&
        (c+1)%groupCols===0
      ){

        seat.style.marginRight=
          "20px";

      }

      if(
        groupRows &&
        r<rows-1 &&
        (r+1)%groupRows===0
      ){

        seat.style.marginBottom=
          "20px";

      }

      grid.appendChild(
        seat
      );

    }

  }

  board.appendChild(
    grid
  );

  if(bottom){

    var bottomBoard=
      document.createElement("div");

    bottomBoard.className=
      "print-blackboard bottom";

    bottomBoard.textContent=
      "黒板";

    board.appendChild(
      bottomBoard
    );

  }

  area.appendChild(
    board
  );

}


function printSeats(
  bottom
){

  createPrintArea(
    bottom
  );

  setTimeout(function(){

    window.print();

  },100);

}


function showStatus(
  message
){

  $("status").textContent=
    message;

  setTimeout(function(){

    if(
      $("status").textContent===
      message
    ){

      $("status").textContent="";

    }

  },2500);

}


function getAnimationOrder(){

  var order=[];

  if(
    $("animationDirection").value===
    "col"
  ){

    for(
      var c=0;
      c<cols;
      c++
    ){

      for(
        var r=0;
        r<rows;
        r++
      ){

        order.push(
          r*cols+c
        );

      }

    }

  }

  else{

    for(
      var r=0;
      r<rows;
      r++
    ){

      for(
        var c=0;
        c<cols;
        c++
      ){

        order.push(
          r*cols+c
        );

      }

    }

  }

  return order;

}


function renderPresentationSeat(index, hidden){
  var seat=document.createElement("div");
  seat.className="seat";
  if(hidden){seat.classList.add("presentation-hidden");}
  var person=students[index];
  seat.textContent=person.name || "空席";
  if(!person.name){seat.classList.add("empty");}
  if(person.gender==="男"){seat.style.color="var(--blue)";}
  else if(person.gender==="女"){seat.style.color="var(--red)";}
  return seat;
}

function setupPresentationGrid(){
  var stage=$("presentationStage");
  stage.innerHTML="";
  var grid=document.createElement("div");
  grid.className="presentation-table";

  var groupCols=+$('groupCols').value;
  var groupRows=+$('groupRows').value;
  var isMobile=window.innerWidth<=750;
  var seatWidth=isMobile?70:100;
  var seatHeight=isMobile?58:68;
  var normalGap=8,groupGap=24;

  var columnTracks=[];
  for(var c=0;c<cols;c++){
    var extra=(groupCols && c<cols-1 && (c+1)%groupCols===0) ? groupGap : normalGap;
    columnTracks.push((seatWidth+extra)+"px");
  }
  var rowTracks=[];
  for(var r=0;r<rows;r++){
    var extraRow=(groupRows && r<rows-1 && (r+1)%groupRows===0) ? groupGap : normalGap;
    rowTracks.push((seatHeight+extraRow)+"px");
  }
  grid.style.gridTemplateColumns=columnTracks.join(" ");
  grid.style.gridTemplateRows=rowTracks.join(" ");

  var seats={};
  for(var i=0;i<rows*cols;i++){
    var seat=renderPresentationSeat(i,true);
    seats[i]=seat;
    grid.appendChild(seat);
  }
  stage.appendChild(grid);
  return {grid:grid,seats:seats};
}

function showNormalAnimation(){
  var board=setupPresentationGrid();
  var order=getAnimationOrder();
  var pointer=0;
  function revealNext(){
    if(pointer>=order.length){return;}
    var index=order[pointer++];
    var seat=board.seats[index];
    seat.classList.remove("presentation-hidden");
    seat.classList.add("presentation-revealed");
    setTimeout(revealNext,600);
  }
  setTimeout(revealNext,100);
}

function showSlotAnimation(){
  var board=setupPresentationGrid();
  var order=getAnimationOrder();
  var pointer=0;
  var pool=students.filter(function(p){return !!p.name;});

  function runOne(){
    if(pointer>=order.length){return;}

    var index=order[pointer++];
    var seat=board.seats[index];
    var person=students[index];

    /* 空席は通常のスロットを行わず、そのまま表示 */
    if(!person.name){
      seat.textContent='空席';
      seat.classList.remove('presentation-hidden');
      seat.classList.add('presentation-revealed');
      setTimeout(runOne,180);
      return;
    }

    /* スロット中は、その席だけ白くして名前を高速で切り替える */
    seat.classList.remove('presentation-hidden');
    seat.style.background='#fff';
    seat.style.borderColor='#d6d6d6';
    seat.style.color='#333';
    seat.classList.add('presentation-revealed');

    var count=0;
    var duration=1000;
    var interval=65;
    var timer=setInterval(function(){
      var random=pool[Math.floor(Math.random()*pool.length)];
      seat.textContent=random.name;
      count++;
      if(count*interval>=duration){
        clearInterval(timer);
        seat.textContent=person.name;
        if(person.gender==='男'){seat.style.color='var(--blue)';}
        else if(person.gender==='女'){seat.style.color='var(--red)';}
        else{seat.style.color='#333';}
        setTimeout(runOne,180);
      }
    },interval);
  }

  setTimeout(runOne,100);
}

function showFinalPresentation(){
  var board=setupPresentationGrid();
  Object.keys(board.seats).forEach(function(key){
    board.seats[key].classList.remove("presentation-hidden");
  });
}

function startPresentation(){
  $("presentation").classList.add("show");
  if($("animationType").value==="slot"){showSlotAnimation();}
  else{showNormalAnimation();}
}

function savePersistentState(){
  try{
    localStorage.setItem("changeSeatsMakerState",JSON.stringify({
      rows:rows,cols:cols,students:students,originalSeats:originalSeats,
      hasPreviousSeat:hasPreviousSeat,columnGenderSettings:columnGenderSettings,
      groupCols:$("groupCols").value,groupRows:$("groupRows").value,
      animationType:$("animationType").value,animationDirection:$("animationDirection").value,
      moveAll:$("moveAll").checked,fixGender:$("fixGender").checked,fixEmpty:$("fixEmpty").checked,
      leaderSeparate:$("leaderSeparate").checked
    }));
  }catch(e){}
}

function loadPersistentState(){
  try{
    var raw=localStorage.getItem("changeSeatsMakerState");
    if(!raw){return false;}
    var state=JSON.parse(raw);
    if(!state){return false;}
    if(state.cols){cols=+state.cols;$("cols").value=cols;}
    if(state.rows){rows=+state.rows;$("rows").value=rows;}
    if(Array.isArray(state.students)){
      students=state.students.map(function(p){return {name:p.name||"",gender:p.gender||""};});
    }
    while(students.length<rows*cols){students.push({name:"",gender:""});}
    students=students.slice(0,rows*cols);
    if(Array.isArray(state.originalSeats)){
      originalSeats=state.originalSeats.map(function(p){return {name:p.name||"",gender:p.gender||""};});
    }
    if(state.hasPreviousSeat!==undefined){hasPreviousSeat=!!state.hasPreviousSeat;}
    columnGenderSettings=Array.isArray(state.columnGenderSettings) ? state.columnGenderSettings.slice(0,cols) : [];
    while(columnGenderSettings.length<cols){columnGenderSettings.push("");}
    if(state.groupCols!==undefined){$("groupCols").value=state.groupCols;}
    if(state.groupRows!==undefined){$("groupRows").value=state.groupRows;}
    if(state.animationType!==undefined){$("animationType").value=state.animationType;}
    if(state.animationDirection!==undefined){$("animationDirection").value=state.animationDirection;}
    if(state.moveAll!==undefined){$("moveAll").checked=!!state.moveAll;}
    if(state.fixGender!==undefined){$("fixGender").checked=!!state.fixGender;}
    if(state.fixEmpty!==undefined){$("fixEmpty").checked=!!state.fixEmpty;}
    if(state.leaderSeparate!==undefined){$("leaderSeparate").checked=!!state.leaderSeparate;}
    return true;
  }catch(e){return false;}
}

function clearSeats(){

  if(
    !confirm(
      "座席表をクリアしますか？"
    )
  ){

    return;

  }

  for(
    var i=0;
    i<students.length;
    i++
  ){

    students[i]={
      name:"",
      gender:""
    };

  }

  originalSeats=
    cloneStudents(
      students
    );

  hasPreviousSeat=false;
  columnGenderSettings=[];

  render();

  refreshSelects();

  renderGenderColumns();

  savePersistentState();

  showStatus(
    "座席表をクリアしました"
  );

}


function resetSeats(){

  if(
    !hasPreviousSeat
  ){

    showStatus(
      "席替え前の座席がありません"
    );

    return;

  }

  students=
    cloneStudents(
      originalSeats
    );

  render();

  refreshSelects();

  renderGenderColumns();

  savePersistentState();

  showStatus(
    "席替え前の座席に戻しました"
  );

}


$("cols").onchange=function(){

  var oldStudents=
    cloneStudents(
      students
    );

  cols=
    +this.value;

  columnGenderSettings=columnGenderSettings.slice(0,cols);
  while(columnGenderSettings.length<cols){columnGenderSettings.push("");}

  var newLength=
    rows*cols;

  students=[];

  for(
    var i=0;
    i<newLength;
    i++
  ){

    students.push(
      oldStudents[i] ||
      {
        name:"",
        gender:""
      }
    );

  }

  render();

  refreshSelects();

};


$("rows").onchange=function(){

  var oldStudents=
    cloneStudents(
      students
    );

  rows=
    +this.value;

  var newLength=
    rows*cols;

  students=[];

  for(
    var i=0;
    i<newLength;
    i++
  ){

    students.push(
      oldStudents[i] ||
      {
        name:"",
        gender:""
      }
    );

  }

  render();

  refreshSelects();

};


$("groupCols").onchange=function(){
  render();
  savePersistentState();
};

$("groupRows").onchange=function(){
  render();
  savePersistentState();
};


$("bulkToggle").onclick=
  function(){

    $("bulkArea")
      .classList.toggle(
        "hidden"
      );

  };


$("applyBulk").onclick=
  function(){

    var text=
      $("bulkInput").value
      .trim();

    if(!text){

      return;

    }

    var lines=
      text
      .split(/\r?\n/)
      .filter(function(line){

        return line.trim();

      });

    var values=[];

    lines.forEach(function(line){

      line
        .split(/[,\t、\s]+/)
        .forEach(function(value){

          if(
            value.trim()
          ){

            values.push(
              value.trim()
            );

          }

        });

    });

    students=[];

    var total=
      rows*cols;

    for(
      var i=0;
      i<total;
      i++
    ){

      var value=
        values[i] || "";

      if(
        value==="空席"
      ){

        value="";

      }

      students.push({

        name:value,

        gender:""

      });

    }

    originalSeats=
      cloneStudents(
        students
      );

    hasPreviousSeat=true;

    render();

    refreshSelects();
    savePersistentState();

    showStatus(
      "一括入力を反映しました"
    );

  };


$("clearBtn").onclick=
  clearSeats;


$("resetBtn").onclick=
  resetSeats;


$("addColumn").onclick=
  function(){

    addColumnRule();

  };


$("addPosition").onclick=
  function(){

    addPositionRule();

  };


$("addNear").onclick=
  function(){

    addDistanceRule(
      "nearRules",
      "以内"
    );

  };


$("addFar").onclick=
  function(){

    addDistanceRule(
      "farRules",
      "以上"
    );

  };


$("addLeader").onclick=
  function(){

    addLeaderRule();

  };


$("shuffleBtn").onclick=
  function(){

    if(
      students.every(function(person){

        return !person.name;

      })
    ){

      showStatus(
        "生徒を入力してください"
      );

      return;

    }

    generateSeats();
    savePersistentState();

    render();

    refreshSelects();

    renderGenderColumns();

    startPresentation();

  };


$("closePresentation").onclick=
  function(){

    $("presentation")
      .classList.remove(
        "show"
      );

  };


$("saveBtn").onclick=
  function(){

    saveAsImage();

  };


$("printTopBtn").onclick=
  function(){

    printSeats(false);

  };


$("printBottomBtn").onclick=
  function(){

    printSeats(true);

  };


/* 設定変更も保存 */
$("animationType").addEventListener("change",savePersistentState);
$("animationDirection").addEventListener("change",savePersistentState);
$("moveAll").addEventListener("change",savePersistentState);
$("fixGender").addEventListener("change",savePersistentState);
$("fixEmpty").addEventListener("change",savePersistentState);
$("leaderSeparate").addEventListener("change",savePersistentState);

/*
 * 初期表示
 */

refreshSelects();

loadPersistentState();

render();

refreshSelects();

renderGenderColumns();

})();
</script>
